  - id: performance.result-acceptance-policy
    revision: 1
    category: acceptance
    state: answered
    provenance: user
    evidence:
      - The current result loop polls every 100 milliseconds and accepts a non-empty normalized result only after two identical reads 500 milliseconds apart, followed by target verification.
      - Google polls only the result snapshot, while Bing and Yandex also perform route and public-control validation during each polling cycle.
      - Returning the first non-empty snapshot can expose a partial translation; preserving the fixed window leaves at least 500 milliseconds of controllable latency on every success.
    prompt_mcp:
      interview_id: spec:translation-provider-reliability-remediation
      batch_id: performance-policy-round-01
      question_id: performance.result-acceptance-policy
      idempotency_key: performance.result-acceptance-policy:v1
      last_status: answered
    question:
      text: Which result-acceptance policy should balance translation quality and speed?
      kind: single
      options:
        - id: adaptive-evidence-gated
          label: Evidence-gated adaptive acceptance (Recommended)
          description: Keep origin, route, target, control, and no-partial-result checks; allow a shorter measured stability path only with equivalent provider-specific completion evidence, otherwise fall back to the existing 500-millisecond confirmation.
        - id: fixed-500-milliseconds
          label: Preserve fixed 500 milliseconds
          description: Optimize polling work around the current two-read confirmation while retaining its full fixed stability delay for every result.
        - id: first-non-empty-result
          label: Accept first non-empty result
          description: Minimize latency by accepting the first valid-looking result, with a greater risk of returning text before the provider has finished updating it.
    answer:
