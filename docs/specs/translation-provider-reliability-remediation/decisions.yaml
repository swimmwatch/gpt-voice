  - id: performance.prewarm-policy
    revision: 1
    category: security
    state: answered
    provenance: user
    evidence:
      - Startup readiness initializes the currently selected provider, and healthy provider pages are retained for warm reuse.
      - Other providers are initialized on demand; choosing a provider or language currently does not navigate or prewarm it for a future action.
      - Prewarming more providers can reduce the first translation delay after switching, but adds background provider connections, browser resources, and provider session activity.
    prompt_mcp:
      interview_id: spec:translation-provider-reliability-remediation
      batch_id: performance-policy-round-01
      question_id: performance.prewarm-policy
      idempotency_key: performance.prewarm-policy:v1
      last_status: answered
    question:
      text: How aggressively may the app prewarm provider pages to reduce cold translation latency?
      kind: single
      options:
        - id: selected-provider-on-demand
          label: Selected provider plus on demand (Recommended)
          description: Keep startup readiness for the selected provider and initialize other providers only when used, avoiding new background connections and resource cost.
        - id: prewarm-on-selection
          label: Prewarm on provider selection
          description: Navigate and prepare a newly selected provider before the next translation, improving its next-request latency but adding a background connection and changing selection side effects.
        - id: prewarm-all-at-startup
          label: Prewarm all at startup
          description: Prepare Google, Bing, and Yandex at launch for the lowest switching latency, with the highest startup, memory, network, privacy, and provider-session cost.
    answer:
      selected_ids: [selected-provider-on-demand]
      text: ''
    rationale: Improve work inside the request path without adding provider connections, browser resources, or privacy-visible selection side effects.
    supersedes_revision: null
    requirement_ids: [PERF-003, SEC-008, COMP-006, ACC-018]

  - id: performance.acceptance-target
    revision: 1
    category: acceptance
    state: answered
    provenance: user
    evidence:
      - Existing live Bing evidence measures 4202 milliseconds cold and 2607 to 3151 milliseconds warm on Linux after earlier fixes.
      - No comparable Google, Yandex, or Windows baseline has been established.
