      kind: single
      options:
        - id: relative-measured-improvement
          label: Relative measured improvement (Recommended)
          description: Establish comparable Linux and Windows cold/warm baselines, require objective improvement in application-controlled latency for Google, Bing, and Yandex, and reject regressions while reporting external provider time separately.
        - id: fixed-absolute-slos
          label: Fixed absolute SLOs
