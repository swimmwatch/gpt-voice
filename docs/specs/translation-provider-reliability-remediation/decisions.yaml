      - Provider audits and ordinary logs carry lengths and typed metadata, not source or result content.
      - Deadline timers, errors, cleanup paths, and tests do not require real selected text, credentials, cookies, sessions, or live provider accounts.
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [preserve-private-data-boundary]
      text: ''
    rationale: Reliability instrumentation must not widen sensitive-data exposure.
    supersedes_revision: null
    requirement_ids: [SEC-001, SEC-002, SEC-003, OBS-002]

