  - id: compatibility.supported-platforms
    revision: 1
    category: compatibility
    state: observed
    provenance: authoritative-doc
    evidence:
      - README.md and SECURITY.md identify Linux x64 and Windows x64 as supported packaged platforms.
      - macOS distribution is paused pending signing and notarization.
      - The affected TypeScript, AbortController, timer, and Playwright contracts are main-process and platform-neutral, but native supported-platform verification remains required.
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [linux-windows, macos-paused]
      text: ''
    rationale: The remediation must behave consistently on supported Linux and Windows packages without expanding release scope.
    supersedes_revision: null
    requirement_ids: [COMP-001, COMP-002, ACC-008]

  - id: compatibility.provider-contract-version
    revision: 1
    category: compatibility
    state: observed
    provenance: authoritative-doc
    evidence:
      - The approved Translation Providers specification requires contractVersion to change whenever provider behavior or code mapping can change translation results.
      - Absolute deadlines can replace a formerly late success with a typed timeout for Google, Bing, or Yandex.
      - Translation cache identity and diagnostic metadata include the provider contract version.
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [bump-all-provider-contract-versions]
      text: ''
    rationale: The shared base lifecycle change affects all three provider contracts and must invalidate version-keyed cache identity.
    supersedes_revision: null
    requirement_ids: [COMP-004, OBS-003]

  - id: compatibility.suspend-time-policy
    revision: 1
    category: compatibility
    state: answered
    provenance: user
    evidence:
      - Linux and Windows monotonic timers can differ in whether elapsed OS suspend time advances the clock.
      - A timer callback cannot run while the process is suspended, so the contract must define behavior immediately after resume.
      - Accepting a translation after a long suspend would conflict with an ordinary interpretation of an absolute wall-clock deadline unless suspended time is explicitly excluded.
    prompt_mcp:
      interview_id: spec:translation-provider-reliability-remediation
      batch_id: compatibility-timing-round-01
      question_id: compatibility.suspend-time-policy
      idempotency_key: compatibility.suspend-time-policy:v1
      last_status: answered
    question:
      text: Should time spent while the computer is suspended count toward the 60-second translation deadline?
      kind: single
      options:
        - id: count-suspended-time
          label: Count suspended time (Recommended)
          description: On resume, reject any operation whose wall-clock budget elapsed and never accept a late provider result.
        - id: pause-during-suspend
          label: Pause during suspend
          description: Measure only active process time so an operation may continue with its remaining budget after resume.
    answer:
      selected_ids: [count-suspended-time]
      text: ''
    rationale: Preserve the absolute wall-clock meaning and reject late results consistently after resume.
    supersedes_revision: null
    requirement_ids: [TIME-005, COMP-001, CONC-004, ACC-008]

  - id: architecture.privilege-ownership
    revision: 1
    category: architecture
    state: observed
    provenance: repository
    evidence:
      - TranslationRuntime and BaseTranslateProvider execute in Electron main.
      - Main owns CloakBrowser, Playwright pages and contexts, selected text, clipboard effects, provider audit, and lifecycle cleanup.
      - No renderer, preload, or IPC contract participates in provider deadline enforcement today.
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [main-process-ownership]
      text: ''
    rationale: Deadline and cleanup authority must remain in the privileged main-process graph.
    supersedes_revision: null
    requirement_ids: [ARCH-001, ARCH-002, SEC-001]

  - id: concurrency.existing-model
    revision: 1
    category: architecture
    state: observed
    provenance: repository
    evidence:
      - SelectedTextTranslationService uses one shared selected-text action gate and silently skips duplicate concurrent hotkey actions.
      - TranslationRuntime owns active AbortControllers and invalidates them on reset or shutdown.
      - BaseTranslateProvider serializes initialization and translation through a promise queue and rejects stale work through generation tokens.
      - Async browser and timer callbacks can interleave even though the affected main-process JavaScript path does not use worker threads.
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [preserve-single-flight, deterministic-race-arbitration]
      text: ''
    rationale: The remediation must strengthen the existing ownership model rather than introduce parallel provider execution.
    supersedes_revision: null
    requirement_ids: [CONC-001, CONC-002, CONC-003, CONC-004]

  - id: timing.result-deadline
    revision: 1
    category: failure
    state: observed
    provenance: repository
    evidence:
      - TRANSLATE_RESULT_TIMEOUT_MS is 15000 milliseconds.
      - BaseTranslateProvider currently converts that value into a read-attempt count, so browser-read and stability-delay duration are not charged to the nominal budget.
      - The accepted review assessment requires a separate absolute result-phase deadline.
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [absolute-existing-15-seconds]
      text: ''
    rationale: Preserve the existing nominal result budget while making its meaning deterministic.
    supersedes_revision: null
    requirement_ids: [TIME-002, TIME-003, FAIL-004]

  - id: failure.no-post-submission-replay
    revision: 1
    category: failure
    state: observed
    provenance: authoritative-doc
    evidence:
      - Translation Providers RUN-006 makes source insertion the submission boundary.
      - After that boundary, the runtime may not reload, recreate a context, or submit source text again automatically.
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [preserve-no-replay]
      text: ''
    rationale: Deadline recovery must never duplicate externally visible translation submission.
    supersedes_revision: null
    requirement_ids: [FAIL-005, SEC-004]

  - id: lifecycle.stale-context-ownership
    revision: 1
    category: architecture
    state: observed
    provenance: repository
    evidence:
      - BaseTranslateProvider publishes a newly created BrowserContext before awaiting newPage.
      - A generation can become stale while newPage is pending.
      - The stale branch releases the detached context without clearing the matching owned field, allowing the next queued generation to close it again.
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [identity-guarded-detachment]
      text: ''
    rationale: Ownership must be cleared only when the field still identifies the detached context.
    supersedes_revision: null
    requirement_ids: [LIFE-001, LIFE-002, CONC-003]

  - id: security.sensitive-text
    revision: 1
    category: security
    state: observed
    provenance: authoritative-doc
    evidence:
