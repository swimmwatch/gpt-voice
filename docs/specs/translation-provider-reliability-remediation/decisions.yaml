  - id: timing.operation-deadline-policy
    revision: 1
    category: failure
    state: answered
    provenance: user
    evidence:
      - Initial provider readiness already uses a fixed absolute 60000 millisecond deadline.
      - Interactive translation can currently traverse two preparation passes and four 60000 millisecond navigation attempts per pass.
      - A fixed internal policy avoids settings, preload, IPC, renderer, and migration changes.
    prompt_mcp:
      interview_id: spec:translation-provider-reliability-remediation
      batch_id: reliability-policy-round-01
      question_id: timing.operation-deadline-policy
      idempotency_key: timing.operation-deadline-policy:v1
      last_status: answered
    question:
      text: Which absolute deadline policy should bound one provider translation, including queue wait and all provider phases before cleanup?
      kind: single
      options:
        - id: fixed-60-seconds
          label: Fixed 60 seconds (Recommended)
          description: Match the existing readiness bound and keep the policy internal and consistent across providers and platforms.
        - id: fixed-90-seconds
          label: Fixed 90 seconds
          description: Allow more time for slow providers while still replacing the current several-minute worst path.
        - id: user-configurable
          label: User configurable
          description: Add a validated persisted setting and coordinated main/preload/renderer contracts for a bounded range.
    answer:
      selected_ids: [fixed-60-seconds]
      text: ''
    rationale: Match the existing provider-readiness bound while avoiding new settings and public contracts.
    supersedes_revision: null
    requirement_ids: [TIME-001, CONF-001, COMP-003]

  - id: failure.timeout-outcome
    revision: 1
    category: failure
    state: answered
    provenance: user
    evidence:
      - Existing provider failures distinguish navigation, page-contract, empty-result, cancellation/staleness, and cleanup failures.
      - cancelledOrStaleOperation is silently discarded and therefore would hide a genuine user-visible timeout.
      - A dedicated timeout outcome gives audits, localization, support diagnostics, and tests one stable cross-phase meaning.
    prompt_mcp:
      interview_id: spec:translation-provider-reliability-remediation
      batch_id: reliability-policy-round-01
      question_id: failure.timeout-outcome
      idempotency_key: failure.timeout-outcome:v1
      last_status: answered
    question:
      text: How should an overall translation deadline expiry be represented to the user and diagnostics?
      kind: single
      options:
        - id: dedicated-timeout
          label: Dedicated timeout (Recommended)
          description: Add one typed internal timeout outcome, a localized retry message, and timeout-class audit metadata without changing IPC payloads.
        - id: existing-phase-failures
          label: Existing phase failures
          description: Reuse the current navigation, page-contract, or result failure according to the active phase and avoid a new failure code.
        - id: silent-cancellation
          label: Silent cancellation
          description: Treat deadline expiry like stale work, suppress user notification, and retain only sanitized audit evidence.
    answer:
      selected_ids: [dedicated-timeout]
      text: ''
    rationale: Keep timeout behavior explicit and supportable without widening renderer or IPC payloads.
    supersedes_revision: null
    requirement_ids: [FAIL-001, FAIL-002, OBS-001]

  - id: failure.cleanup-settlement
    revision: 1
    category: failure
    state: answered
    provenance: user
    evidence:
      - Promise.race alone can settle the caller while Playwright work and selected text remain active in the background.
      - Waiting without a cleanup bound can recreate an unbounded user-visible operation if page or context close stalls.
      - Existing terminal failures already prefer cleanupFailure when owned resource closure fails.
    prompt_mcp:
      interview_id: spec:translation-provider-reliability-remediation
      batch_id: reliability-policy-round-01
      question_id: failure.cleanup-settlement
      idempotency_key: failure.cleanup-settlement:v1
      last_status: answered
    question:
      text: What cleanup contract should apply after the operation deadline expires?
      kind: single
      options:
        - id: bounded-5-second-cleanup
          label: Five-second cleanup bound (Recommended)
          description: Invalidate ownership immediately, allow up to five additional seconds for page/context closure, then settle with cleanup failure if closure is not confirmed.
        - id: wait-until-closed
          label: Wait until closed
          description: Do not settle until page/context closure finishes, preserving strongest cleanup confirmation but losing a strict user-visible upper bound.
        - id: detached-background-cleanup
          label: Background cleanup
          description: Settle at the operation deadline after detaching ownership and continue best-effort closure asynchronously.
    answer:
      selected_ids: [bounded-5-second-cleanup]
      text: ''
    rationale: Bound user-visible settlement while giving owned Playwright resources a short fail-closed cleanup window.
    supersedes_revision: null
    requirement_ids: [TIME-004, LIFE-003, FAIL-003, SEC-004]

  - id: failure.cleanup-bound-scope
    revision: 1
    category: failure
    state: answered
    provenance: user
    evidence:
      - Applying the cleanup grace only after overall timeout leaves ordinary success and failure cleanup outside the new absolute settlement contract.
      - Provider visible-state clearing is already nominally bounded, but Playwright page/context closure has no independent wall-clock bound.
      - One cleanup policy across terminal paths gives deterministic race, audit, and cross-platform behavior.
    prompt_mcp:
      interview_id: spec:translation-provider-reliability-remediation
      batch_id: cleanup-scope-round-01
      question_id: failure.cleanup-bound-scope
      idempotency_key: failure.cleanup-bound-scope:v1
      last_status: answered
    question:
      text: Should the selected five-second cleanup bound apply to every terminal path or only after the overall operation deadline expires?
      kind: single
      options:
        - id: all-terminal-cleanup
          label: All terminal cleanup (Recommended)
          description: Bound visible clearing and page/context closure after success, ordinary failure, result timeout, cancellation, and overall timeout.
        - id: overall-timeout-only
          label: Overall timeout only
          description: Apply the five-second grace only after the 60-second operation deadline and preserve existing cleanup timing on other outcomes.
    answer:
      selected_ids: [all-terminal-cleanup]
      text: ''
    rationale: Apply one bounded cleanup and ownership policy to every terminal path.
    supersedes_revision: null
    requirement_ids: [TIME-004, LIFE-003, FAIL-003, ACC-005]

