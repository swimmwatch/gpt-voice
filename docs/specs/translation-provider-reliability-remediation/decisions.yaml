  - id: performance.result-acceptance-policy
    revision: 1
    category: acceptance
    state: answered
    provenance: user
    evidence:
      - The current result loop polls every 100 milliseconds and accepts a non-empty normalized result only after two identical reads 500 milliseconds apart, followed by target verification.
      - Google polls only the result snapshot, while Bing and Yandex also perform route and public-control validation during each polling cycle.
      - Returning the first non-empty snapshot can expose a partial translation; preserving the fixed window leaves at least 500 milliseconds of controllable latency on every success.
    prompt_mcp:
      interview_id: spec:translation-provider-reliability-remediation
      batch_id: performance-policy-round-01
      question_id: performance.result-acceptance-policy
      idempotency_key: performance.result-acceptance-policy:v1
      last_status: answered
    question:
      text: Which result-acceptance policy should balance translation quality and speed?
      kind: single
      options:
        - id: adaptive-evidence-gated
          label: Evidence-gated adaptive acceptance (Recommended)
          description: Keep origin, route, target, control, and no-partial-result checks; allow a shorter measured stability path only with equivalent provider-specific completion evidence, otherwise fall back to the existing 500-millisecond confirmation.
        - id: fixed-500-milliseconds
          label: Preserve fixed 500 milliseconds
          description: Optimize polling work around the current two-read confirmation while retaining its full fixed stability delay for every result.
        - id: first-non-empty-result
          label: Accept first non-empty result
          description: Minimize latency by accepting the first valid-looking result, with a greater risk of returning text before the provider has finished updating it.
    answer:
      selected_ids: [adaptive-evidence-gated]
      text: ''
    rationale: Preserve every correctness and trust-boundary check while permitting a faster path only where provider-specific completion evidence is equivalent to the fixed stability confirmation.
    supersedes_revision: null
    requirement_ids: [PERF-002, QUAL-001, SEC-008, ACC-017]

  - id: performance.prewarm-policy
    revision: 1
    category: security
    state: answered
    provenance: user
    evidence:
      - Startup readiness initializes the currently selected provider, and healthy provider pages are retained for warm reuse.
      - Other providers are initialized on demand; choosing a provider or language currently does not navigate or prewarm it for a future action.
      - Prewarming more providers can reduce the first translation delay after switching, but adds background provider connections, browser resources, and provider session activity.
    prompt_mcp:
      interview_id: spec:translation-provider-reliability-remediation
      batch_id: performance-policy-round-01
      question_id: performance.prewarm-policy
      idempotency_key: performance.prewarm-policy:v1
      last_status: answered
    question:
      text: How aggressively may the app prewarm provider pages to reduce cold translation latency?
      kind: single
      options:
        - id: selected-provider-on-demand
          label: Selected provider plus on demand (Recommended)
          description: Keep startup readiness for the selected provider and initialize other providers only when used, avoiding new background connections and resource cost.
        - id: prewarm-on-selection
          label: Prewarm on provider selection
          description: Navigate and prepare a newly selected provider before the next translation, improving its next-request latency but adding a background connection and changing selection side effects.
        - id: prewarm-all-at-startup
          label: Prewarm all at startup
          description: Prepare Google, Bing, and Yandex at launch for the lowest switching latency, with the highest startup, memory, network, privacy, and provider-session cost.
    answer:
      selected_ids: [selected-provider-on-demand]
      text: ''
    rationale: Improve work inside the request path without adding provider connections, browser resources, or privacy-visible selection side effects.
    supersedes_revision: null
    requirement_ids: [PERF-003, SEC-008, COMP-006, ACC-018]

  - id: performance.acceptance-target
    revision: 1
    category: acceptance
    state: answered
    provenance: user
    evidence:
      - Existing live Bing evidence measures 4202 milliseconds cold and 2607 to 3151 milliseconds warm on Linux after earlier fixes.
      - No comparable Google, Yandex, or Windows baseline has been established.
      - Provider network and server time are externally controlled, while polling, DOM snapshots, validation sequencing, stability confirmation, and lifecycle overhead are application-controlled.
    prompt_mcp:
      interview_id: spec:translation-provider-reliability-remediation
      batch_id: performance-policy-round-01
      question_id: performance.acceptance-target
      idempotency_key: performance.acceptance-target:v1
      last_status: answered
    question:
      text: What measurable performance target should the specification require for each provider?
      kind: single
      options:
        - id: relative-measured-improvement
          label: Relative measured improvement (Recommended)
          description: Establish comparable Linux and Windows cold/warm baselines, require objective improvement in application-controlled latency for Google, Bing, and Yandex, and reject regressions while reporting external provider time separately.
        - id: fixed-absolute-slos
          label: Fixed absolute SLOs
          description: Set one mandatory cold and warm end-to-end latency limit for all providers and supported platforms despite provider/network variability and missing baselines.
        - id: best-effort-no-gate
          label: Best effort without gate
          description: Request faster behavior and record measurements, but do not make a quantified latency comparison part of acceptance.
    answer:
      selected_ids: [relative-measured-improvement]
      text: ''
    rationale: Use per-provider and per-platform evidence instead of inventing uniform absolute limits before comparable baselines exist.
    supersedes_revision: null
    requirement_ids: [PERF-004, ACC-019]

  - id: performance.path-priority
    revision: 1
    category: acceptance
    state: answered
    provenance: user
    evidence:
      - Users experience both cold translations that require provider setup and warm translations that reuse a healthy context.
      - Warm reuse is the normal repeated-use path, while cold behavior determines first-use and recovery latency.
      - Optimizing only one path can hide a regression in the other.
    prompt_mcp:
      interview_id: spec:translation-provider-reliability-remediation
      batch_id: performance-policy-round-01
      question_id: performance.path-priority
      idempotency_key: performance.path-priority:v1
      last_status: answered
    question:
      text: Which successful translation paths must the performance work optimize and gate separately?
      kind: single
      options:
        - id: cold-and-warm-separately
          label: Cold and warm separately (Recommended)
          description: Measure and improve both paths for every provider, preventing a gain in one path from hiding a regression in the other.
        - id: warm-first
          label: Prioritize warm translations
          description: Gate repeated healthy-context requests and treat cold initialization as secondary best-effort work.
        - id: cold-first
          label: Prioritize cold translations
          description: Gate first-use and recovery requests and treat warm-context latency as secondary best-effort work.
    answer:
      selected_ids: [cold-and-warm-separately]
      text: ''
    rationale: Prevent a faster repeated-use path from masking slower first-use or recovery behavior, and vice versa.
    supersedes_revision: null
    requirement_ids: [PERF-005, ACC-018, ACC-019]

