  - id: research.whisper-cpp-runtime
    revision: 1
    category: architecture
    state: observed
    provenance: authoritative-doc
    evidence:
      - whisper.cpp v1.9.1 was released on 2026-06-19 under MIT and provides a C API with explicit context creation and release.
      - Its v1.9.1 documentation supports NVIDIA CUDA, cross-vendor Vulkan, AMD HIP/ROCm, CPU execution, and first-class Apple Silicon Metal with optional Core ML encoder acceleration.
      - https://github.com/ggml-org/whisper.cpp/releases/tag/v1.9.1
      - https://github.com/ggml-org/whisper.cpp/blob/v1.9.1/README.md
      - https://github.com/ggml-org/whisper.cpp/blob/v1.9.1/include/whisper.h
    answer:
      selected_ids: [one-native-cross-platform-engine]
      text: ''
    rationale: This is evidence for the whisper.cpp adapter, not a normative single-engine limit. The later user decision architecture.inference-engine adds Faster-Whisper behind the same supervised-sidecar boundary.
    supersedes_revision: null
    requirement_ids: [ARCH-005, RUNTIME-001]

  - id: research.faster-whisper-alternative
    revision: 1
    category: architecture
    state: observed
    provenance: authoritative-doc
    evidence:
      - faster-whisper v1.2.1 documents GPU execution with NVIDIA CUDA 12 and cuDNN 9 and provides strong NVIDIA performance and Distil-Whisper compatibility.
      - CTranslate2 added ROCm in v4.7.0 and released Linux and Windows ROCm wheels in v4.8.1 on 2026-07-03, but faster-whisper does not yet document that route as its supported AMD GPU contract.
      - https://github.com/SYSTRAN/faster-whisper/blob/v1.2.1/README.md#gpu
      - https://github.com/OpenNMT/CTranslate2/releases/tag/v4.7.0
      - https://github.com/OpenNMT/CTranslate2/releases/tag/v4.8.1
    answer:
      selected_ids: [nvidia-optimized-but-amd-route-immature]
      text: ''
    rationale: It would add Python, CTranslate2, and cuDNN packaging while producing a less settled common AMD and Apple path.
    supersedes_revision: null
    requirement_ids: [RUNTIME-002]

  - id: research.amd-platform-reality
    revision: 1
    category: compatibility
    state: observed
    provenance: authoritative-doc
    evidence:
      - whisper.cpp v1.9.1 documents Vulkan as cross-vendor and HIP builds as requiring an explicit AMDGPU_TARGETS architecture.
      - Current AMD Linux ROCm documentation states that an unlisted GPU is not officially supported and requires an exact GPU and OS intersection plus device-node permissions.
      - Current AMD Windows HIP SDK documentation supports only a subset of ROCm components and GPU families; CMake HIP Language and AI frameworks remain unavailable on Windows.
      - whisper.cpp Vulkan initialization requires Vulkan 1.2 and storageBuffer16BitAccess; enumeration alone does not prove a runnable compute path.
      - https://rocm.docs.amd.com/projects/install-on-linux/en/latest/reference/system-requirements.html
      - https://rocm.docs.amd.com/projects/install-on-windows/en/latest/reference/system-requirements.html
      - https://rocm.docs.amd.com/projects/install-on-windows/en/latest/conceptual/component-support.html
      - https://github.com/ggml-org/whisper.cpp/blob/v1.9.1/ggml/src/ggml-vulkan/ggml-vulkan.cpp
    answer:
      selected_ids: [feasible-but-preview-until-hardware-validated]
      text: ''
    rationale: AMD vendor detection is insufficient; the exact backend, GPU target, driver, OS, allocation, model load, and warm-up must succeed.
    supersedes_revision: null
    requirement_ids: [AMD-001, AMD-002, CAP-002]

  - id: research.model-artifacts
    revision: 1
    category: scope
    state: observed
    provenance: authoritative-doc
    evidence:
      - whisper.cpp v1.9.1 publishes a ggml model catalog with pinned hashes and artifact sizes from 75 MiB to 2.9 GiB; its approximate runtime memory table ranges from 273 MB to 3.9 GB before application headroom.
      - Distilled-model support is described as initial and potentially suboptimal because the chunk-based transcription strategy is not implemented.
      - https://github.com/ggml-org/whisper.cpp/blob/v1.9.1/models/README.md
      - https://github.com/ggml-org/whisper.cpp/blob/v1.9.1/README.md#memory-usage
    answer:
      selected_ids: [pinned-ggml-artifacts-with-distil-caveat]
      text: ''
    rationale: The ggml evidence applies to the whisper.cpp adapter. Faster-Whisper uses separately pinned CTranslate2 artifacts; for both formats, file size is only an estimate and actual warm-up is the definitive compatibility gate.
    supersedes_revision: null
    requirement_ids: [MODEL-003, CAP-003]

  - id: research.directml-non-direction
    revision: 1
    category: compatibility
    state: observed
    provenance: authoritative-doc
    evidence:
      - Microsoft describes DirectML as being in sustained engineering and directs new Windows AI work to Windows ML.
      - DirectML or Windows ML would require a second ONNX model and decoder path rather than reusing the selected whisper.cpp model/runtime contract.
      - https://github.com/microsoft/DirectML#readme
      - https://learn.microsoft.com/windows/ai/new-windows-ml/overview
    answer:
      selected_ids: [exclude-directml-from-v1]
      text: ''
    rationale: A second inference stack does not improve the current untested AMD confidence boundary.
    supersedes_revision: null
    requirement_ids: [NONGOAL-002]

  - id: architecture.runtime-ownership
    revision: 1
    category: architecture
    state: observed
    provenance: repository
    evidence:
      - VoiceProviderFactory intentionally creates fresh provider instances, including instances used for settings snapshots.
      - Active-provider switch and application shutdown already serialize provider shutdown and surface cleanup failures.
      - Linux Chromium GPU acceleration is disabled, so Electron renderer GPU status is not an inference capability contract.
    answer:
      selected_ids: [composition-root-owned-supervised-worker]
      text: ''
    rationale: Model inventory, worker ownership, GPU state, and downloads must live in main-owned services; provider snapshots must remain side-effect free.
    supersedes_revision: null
    requirement_ids: [ARCH-006, LIFE-001]

  - id: scope.provider-identity
    revision: 1
    category: scope
    state: answered
    provenance: user
    evidence:
      - The request consistently names the feature Local Whisper but once asks for a "local dispart provider" settings screen.
      - The repository contains neither "dispart" nor a Distil-Whisper provider.
      - whisper.cpp v1.9.1 calls distilled-model support initial and potentially suboptimal.
    prompt_mcp:
      interview_id: spec:local-whisper
      batch_id: technical-scope-round-01
      question_id: scope.provider-identity
      idempotency_key: scope.provider-identity:v1
      last_status: answered
      revision: 1
    question:
      text: What should "local dispart provider" mean in this specification?
      kind: single
      options:
        - id: local-whisper-canonical
          label: Local Whisper only (Recommended)
          description: Treat "dispart" as a typo, define one Local Whisper provider, and keep Distil-Whisper artifacts out of the first release because upstream support is still qualified.
        - id: local-whisper-with-distil
          label: Include Distil models
          description: Keep one Local Whisper provider but include curated Distil-Whisper artifacts with an explicit quality and support caveat.
        - id: separate-local-distil
          label: Separate Distil provider
          description: Define canonical Local Whisper and Local Distil-Whisper as separate providers with separate settings and acceptance contracts.
    answer:
      selected_ids: [canonical-and-faster-whisper]
      text: Build the architecture for both canonical Whisper and Faster-Whisper variants.
    rationale: The committed custom answer expands the first release beyond canonical whisper.cpp artifacts; exact provider and engine selection UX requires a follow-up decision.
    supersedes_revision: null
    requirement_ids: [SCOPE-001]

  - id: architecture.inference-engine
    revision: 1
    category: architecture
    state: answered
    provenance: user
    evidence:
      - whisper.cpp v1.9.1 provides one MIT native engine across CUDA, Vulkan, HIP/ROCm, and future Metal.
      - faster-whisper currently documents NVIDIA CUDA and cuDNN while its AMD dependency path is recent and not yet a documented faster-whisper support contract.
      - The Electron main-process boundary favors an isolated, supervised worker over a native Node addon.
    prompt_mcp:
      interview_id: spec:local-whisper
      batch_id: technical-scope-round-01
      question_id: architecture.inference-engine
      idempotency_key: architecture.inference-engine:v1
      last_status: answered
      revision: 1
    question:
      text: Which inference-engine contract should the first Local Whisper implementation use?
      kind: single
      options:
        - id: whisper-cpp-sidecar
          label: whisper.cpp sidecar (Recommended)
          description: Pin one whisper.cpp release and run it in a supervised native worker with framed stdio, common model artifacts, and process-level crash and VRAM isolation.
        - id: faster-whisper-sidecar
          label: faster-whisper sidecar
          description: Optimize around Python, CTranslate2, CUDA, and cuDNN, accepting a newer and less settled AMD route plus a separate future Apple strategy.
        - id: external-runtime
          label: User-managed runtime
          description: Connect to an independently installed local service or executable, reducing packaged native code while making setup, versioning, and lifecycle externally owned.
    answer:
      selected_ids: [whisper-cpp-and-faster-whisper]
      text: Include both whisper.cpp and Faster-Whisper rather than selecting only one engine.
    rationale: This supersedes the evidence-backed single-engine recommendation and requires two isolated runtime adapters, model formats, dependency packs, capability probes, and acceptance matrices behind one shared domain contract.
    supersedes_revision: null
    requirement_ids: [RUNTIME-001]

  - id: compatibility.release-tiers
    revision: 1
    category: compatibility
    state: answered
    provenance: user
    evidence:
