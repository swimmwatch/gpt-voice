      batch_id: technical-scope-round-01
      question_id: compatibility.release-tiers
      idempotency_key: compatibility.release-tiers:v1
      last_status: answered
      revision: 1
    question:
      text: Which support tiers should gate the first Local Whisper release?
      kind: single
      options:
        - id: nvidia-production-amd-preview
          label: NVIDIA production, AMD Preview (Recommended)
          description: Target NVIDIA CUDA on Windows and Linux for production only after each OS passes its hardware gate; expose AMD as Preview and macOS arm64 as planned but unavailable.
        - id: linux-nvidia-production
          label: Linux NVIDIA production
          description: Make only tested Linux x64 NVIDIA production-ready; keep Windows NVIDIA and all AMD paths in Preview until representative hardware is available.
        - id: all-windows-linux-preview
          label: Preview everywhere
          description: Keep every Windows and Linux GPU path in Preview until representative NVIDIA and AMD hardware has passed the complete acceptance matrix.
    answer:
      selected_ids: [nvidia-production-amd-preview]
      text: ''
    rationale: ''
    supersedes_revision: null
    requirement_ids: [COMP-004, NVIDIA-001, AMD-003, MAC-001]

  - id: compatibility.amd-backend
    revision: 1
    category: compatibility
    state: answered
    provenance: user
    evidence:
      - Windows HIP is a subset of ROCm with material component and GPU-family limits.
      - Linux HIP requires an exact supported GPU, OS, compiled gfx target, and device permissions.
      - whisper.cpp Vulkan is cross-vendor but still requires a real feature, dispatch, and model-load probe.
    prompt_mcp:
      interview_id: spec:local-whisper
      batch_id: technical-scope-round-01
      question_id: compatibility.amd-backend
      idempotency_key: compatibility.amd-backend:v1
      last_status: answered
      revision: 1
    question:
      text: Which AMD backend policy should the Preview contract use?
      kind: single
      options:
        - id: windows-vulkan-linux-hip-vulkan
          label: Vulkan Windows, HIP Linux (Recommended)
          description: Prefer Vulkan on Windows; on Linux prefer HIP only for the exact supported ROCm matrix and compiled gfx target, with explicitly selected Vulkan as a probed fallback.
        - id: vulkan-both-platforms
          label: Vulkan on both
          description: Use one cross-vendor Vulkan backend on Windows and Linux, simplifying distribution while accepting a different performance and compatibility profile from CUDA or HIP.
        - id: hip-both-platforms
          label: HIP on both
          description: Standardize on HIP/ROCm for AMD despite the narrower Windows component, build, and supported-device matrix.
    answer:
      selected_ids: [windows-vulkan-linux-hip-vulkan]
      text: ''
    rationale: ''
    supersedes_revision: null
    requirement_ids: [AMD-004]

  - id: compatibility.cpu-fallback
    revision: 1
    category: compatibility
    state: answered
    provenance: user
    evidence:
      - The requested outcome specifically targets execution on the user's GPU.
      - Silent CPU fallback would make device validation misleading and can turn an expected fast local action into prolonged CPU and battery use.
    prompt_mcp:
      interview_id: spec:local-whisper
      batch_id: technical-scope-round-01
      question_id: compatibility.cpu-fallback
      idempotency_key: compatibility.cpu-fallback:v1
      last_status: answered
      revision: 1
    question:
      text: What should happen when no compatible GPU backend can run the selected model?
      kind: single
      options:
        - id: gpu-only-no-fallback
          label: Block without GPU (Recommended)
          description: Mark Local Whisper unavailable with an actionable reason and never fall back silently to CPU; other Voice providers remain selectable.
        - id: explicit-cpu-preview
          label: Opt-in CPU Preview
          description: Block by default but expose a clearly warned, manually enabled CPU mode outside the production GPU support tier.
        - id: automatic-cpu-fallback
          label: Automatic CPU fallback
          description: Continue transcription on CPU whenever GPU probing or loading fails, favoring completion over predictable latency and resource use.
    answer:
      selected_ids: [gpu-and-cpu-supported]
      text: Support execution through either a GPU or the CPU.
    rationale: The committed custom answer authorizes CPU execution, but whether selection is explicit or an automatic failure fallback remains a separate material decision.
    supersedes_revision: null
    requirement_ids: [CAP-004, COMP-005]

  - id: architecture.engine-exposure
    revision: 1
    category: architecture
    state: answered
    provenance: user
    evidence:
      - The committed engine decision requires both whisper.cpp and Faster-Whisper.
      - The two engines use different runtime dependencies, model artifacts, compute modes, and platform matrices while serving the same Voice outcome.
    prompt_mcp:
      interview_id: spec:local-whisper
      batch_id: runtime-selection-round-02
      question_id: architecture.engine-exposure
      idempotency_key: architecture.engine-exposure:v1
      last_status: answered
      revision: 1
    question:
      text: How should users choose between whisper.cpp and Faster-Whisper?
      kind: single
      options:
        - id: one-provider-explicit-engine
          label: One provider, engine setting (Recommended)
          description: Keep one Local Whisper provider and require an explicit engine selection; filter models and compute options by that engine and never switch engines after an operation starts.
        - id: two-separate-providers
          label: Two Voice providers
          description: Expose Local Whisper (whisper.cpp) and Faster-Whisper as separate Voice providers with independent settings, readiness, and model inventories.
        - id: automatic-engine-routing
          label: Automatic engine routing
          description: Keep one provider and let the application select an engine from device and model capabilities, accepting that upgrades may change the resolved runtime and output.
    answer:
      selected_ids: [one-provider-explicit-engine]
      text: ''
    rationale: ''
    supersedes_revision: null
    requirement_ids: [ARCH-007, UI-003]

