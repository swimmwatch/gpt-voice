      kind: single
      options:
        - id: canonical-whisper-both-engines
          label: Canonical Whisper only (Recommended)
          description: Offer a curated set of canonical Whisper models in each engine's native format; defer Distil-Whisper until separate quality evidence exists.
        - id: canonical-plus-distil-faster
          label: Add Distil to Faster-Whisper
          description: Offer canonical models for both engines and curated Distil-Whisper models only when Faster-Whisper is selected.
        - id: broad-upstream-catalog
          label: Broad upstream catalog
          description: Expose canonical, English-only, quantized, Distil, and other upstream-compatible variants, increasing inventory, validation, and support surface.
    answer:
      selected_ids: [canonical-whisper-both-engines]
      text: ''
    rationale: ''
    supersedes_revision: null
    requirement_ids: [MODEL-004]

  - id: compatibility.execution-target-policy
    revision: 1
    category: compatibility
    state: answered
    provenance: user
    evidence:
      - The committed custom answer requires both GPU and CPU execution.
      - Automatic CPU fallback can materially change latency, battery use, thermals, and whether a compatibility result is truthful.
    prompt_mcp:
      interview_id: spec:local-whisper
      batch_id: runtime-selection-round-02
      question_id: compatibility.execution-target-policy
      idempotency_key: compatibility.execution-target-policy:v1
      last_status: answered
      revision: 1
    question:
      text: How should GPU versus CPU execution be selected?
      kind: single
      options:
        - id: explicit-gpu-or-cpu
