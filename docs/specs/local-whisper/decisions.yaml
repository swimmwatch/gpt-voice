    provenance: user
    evidence:
      - Both engines can run canonical Whisper families but require different artifact formats.
      - Faster-Whisper is especially compatible with Distil-Whisper; whisper.cpp describes its own distilled path as initial and potentially suboptimal.
    prompt_mcp:
      interview_id: spec:local-whisper
      batch_id: runtime-selection-round-02
      question_id: scope.model-families
      idempotency_key: scope.model-families:v1
      last_status: answered
      revision: 1
    question:
