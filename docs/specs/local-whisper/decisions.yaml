  - id: architecture.model-authority-handoff
    revision: 2
    category: architecture
    state: observed
    provenance: authoritative-doc
    evidence:
      - Windows DuplicateHandle creates a valid target-process handle but cannot select or guarantee numeric OS handle value 3; PROC_THREAD_ATTRIBUTE_HANDLE_LIST only restricts which inheritable handles reach the child.
      - Linux SO_PEERCRED on a pre-created socket pair is not sufficient per-message sender authentication; SO_PASSCRED and kernel-validated SCM_CREDENTIALS bind credentials to the recvmsg record.
      - Linux descriptor transfer can realize actual fd 3 with dup3 immediately before exec, while Windows requires an authenticated logical-slot-to-arbitrary-HANDLE binding.
      - https://learn.microsoft.com/windows/win32/api/handleapi/nf-handleapi-duplicatehandle
      - https://learn.microsoft.com/windows/win32/api/processthreadsapi/nf-processthreadsapi-updateprocthreadattribute
      - https://learn.microsoft.com/windows/win32/procthread/inheritance
      - https://www.man7.org/linux/man-pages/man7/unix.7.html
      - https://www.man7.org/linux/man-pages/man2/recvmsg.2.html
    answer:
      selected_ids: [platform-specific-logical-slot-and-message-credentials]
      text: ''
    rationale: Logical slot 3 preserves one cross-platform protocol concept without asserting an impossible Windows handle value. Bidirectional per-message credentials bind the one-use Linux request and descriptor response to the expected post-exec processes.
    supersedes_revision: 1
