  - id: research.revision-6-source-and-platform-clarifications
    revision: 1
    category: security
    state: observed
    provenance: authoritative-doc
    evidence:
      - Commit-pinned nlohmann/json SAX callbacks receive normalized numeric values and therefore cannot alone prove that an integer lexeme was not `-0`, decimal, or exponent notation; the bounded project codec must validate lexical tokens before or alongside SAX.
      - Linux `dup3(oldfd, newfd, flags)` fails with `EINVAL` when `oldfd == newfd`; an authenticated transferred descriptor already numbered 3 therefore needs an explicit collision-safe branch.
      - A Windows process created suspended cannot acknowledge its private logical-slot bootstrap until it is resumed; Job assignment must precede resume, while bootstrap acknowledgement must precede ordinary worker handshake or model parsing.
      - Pinned whisper.cpp requires HIP 6.1 or newer to compile, but AMD product compatibility is an exact ROCm/GPU/OS/driver matrix intersection rather than an open-ended minimum-version range.
      - Pinned whisper.cpp can discover backend modules from the working directory and `GGML_BACKEND_PATH`; production accelerator workers therefore require `GGML_BACKEND_DL=OFF`, exactly one explicitly enabled accelerator, and all other optional backend/build targets disabled.
      - https://github.com/nlohmann/json/blob/55f93686c01528224f448c19128836e7df245f72/single_include/nlohmann/json.hpp
      - https://man7.org/linux/man-pages/man2/dup.2.html
      - https://learn.microsoft.com/en-us/windows/win32/procthread/process-creation-flags
      - https://learn.microsoft.com/en-us/windows/win32/procthread/job-objects
      - https://rocm.docs.amd.com/en/latest/compatibility/compatibility-matrix.html
      - https://github.com/ggml-org/whisper.cpp/blob/f049fff95a089aa9969deb009cdd4892b3e74916/ggml/src/ggml-backend-reg.cpp
    answer:
