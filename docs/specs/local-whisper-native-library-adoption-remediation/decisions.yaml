      last_status: answered
    question:
      text: Beyond base64url and hexadecimal codecs, how should the specification use libsodium's comparison and memory APIs?
      kind: single
      options:
        - id: secret-scoped-hardening
          label: Harden actual secrets only (Recommended)
          description: Use constant-time comparison and explicit wiping only for fixed-length secret or capability-verifier buffers, not public digests, identities, or nonces.
        - id: all-digests-and-nonces
          label: Harden all digests and nonces
          description: Apply constant-time comparison and wiping to every authority digest, fingerprint, challenge, and nonce regardless of secrecy.
        - id: codecs-only
          label: Codecs only
          description: Use libsodium for base64url/hex and add no comparison or memory-wiping behavior.
    answer:
      selected_ids: [all-digests-and-nonces]
      text: ''
    rationale: Constant-time comparison and explicit wiping apply to every in-scope authority digest, fingerprint, challenge, and nonce, not only values currently classified as secret.
    supersedes_revision: null
    requirement_ids: [SEC-003, SEC-004]

