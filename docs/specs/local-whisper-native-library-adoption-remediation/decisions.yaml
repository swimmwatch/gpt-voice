gap_analysis:
  status: complete
  unresolved_material_decisions: []
  perspectives:
    user: Transcript repair, bounded truncation, safe failures, and unchanged desktop behavior are defined.
    operator: Static packaging, source locks, initialization failure, atomic rollout/rollback, performance disclosure, and qualification gates are defined.
    implementer: Library ownership, SHA policy, codec compatibility, UTF surfaces, secure value ownership, and supersession boundaries are defined without task ordering.
    tester: Cross-platform vectors, malformed/oversized cases, concurrency, initialization failure, source-lock, binary closure, and manual host evidence are objective.
    security_reviewer: Strict inputs, constant-time comparison, tracked wiping, privacy, disconnected supply chain, static linkage, and fail-closed behavior are bounded.
    maintainer: Non-goals, exact-lock update policy, no mixed revisions, plan invalidation boundaries, and completion gates are explicit.
