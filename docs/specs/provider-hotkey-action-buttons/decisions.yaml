  - id: workflow.provider-lock-rules
    revision: 1
    category: workflow
    state: observed
    provenance: repository
    evidence:
      - 'src/shared/mainInteractionLock.ts owns the process-wide settings-window lock and refuses acquisition during recording or another selected-text operation.'
      - 'src/main/shortcuts.ts suspends global shortcuts while the main interaction lock is held and applies recording and selected-text single-flight gates.'
      - 'src/renderer/App.tsx separately derives provider-configuration and new-recording locks from provider switching, recording lifecycle, model actions, and selected-text activity.'
      - 'src/shared/recordingLifecycle.ts permits the configured Voice action to start while idle, pause while recording, and resume while paused, while text actions require an idle recording lifecycle.'
    prompt_mcp: null
    question: null
    answer:
      selected_ids: []
      text: 'Provider Lock is a derived per-action eligibility state, not a connection-state replacement or persisted setting. It must preserve the canonical main-process action gates, lock every action during process-wide configuration lock or stale/unknown eligibility, lock cross-provider actions during mutually exclusive work, and keep only lifecycle actions that remain meaningful available.'
    rationale: 'Reusing the existing authoritative gates prevents renderer and global-shortcut behavior from diverging.'
    supersedes_revision: null
    requirement_ids: [LOCK-001, LOCK-002, LOCK-003, LOCK-004, ARCH-006]

  - id: visual.provider-lock-transition
    revision: 1
    category: workflow
    state: answered
    provenance: user
    evidence:
      - 'The user requires a lock animation in which a button remains visually clickable initially and then transitions to the Disabled state.'
      - 'The current reusable demo key uses a 110-millisecond mechanical release interval and separate enabled and disabled keyboard-key treatments.'
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [mechanical-then-disabled]
      text: 'When an already enabled hotkey button becomes locked, behavioral and semantic rejection begins immediately, the enabled or pressed key appearance is retained long enough to complete one short mechanical feedback cycle, and the key then transitions into the Disabled appearance without moving adjacent layout.'
    rationale: 'The visual delay is feedback only and must never delay the authoritative action lock.'
    supersedes_revision: null
    requirement_ids: [LOCK-005, LOCK-006, LOCK-007, MOTION-006]

