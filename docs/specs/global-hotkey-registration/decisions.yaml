  - id: platform.wayland-binding-truth
    revision: 1
    category: interface
    state: answered
    provenance: user
    evidence:
      - 'The XDG Global Shortcuts portal treats the requested accelerator as a preferred trigger and returns the effective trigger separately.'
      - 'Electron globalShortcut does not expose the portal trigger_description required to report the exact effective trigger.'
      - 'After receiving the recommended desktop-managed representation, the user explicitly instructed Codex to update the specification and plan.'
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [desktop-managed-unknown-effective]
      text: 'A successful Wayland binding retains the configured accelerator only as a preference, reports DesktopEnvironment authority, exposes no effective accelerator, and uses physical Test for in-app verification.'
    rationale: 'This preserves Electron-only portal integration without presenting a preferred trigger as an OS-confirmed effective key.'
    supersedes_revision: null
    requirement_ids: [OUT-001, DATA-005, DATA-008, UI-001, UI-004, UI-006, UI-010, PLAT-006, QUAL-005, QUAL-010]

  - id: compatibility.appimage-desktop-migration
    revision: 1
    category: compatibility
    state: answered
    provenance: user
    evidence:
      - 'Repository inspection found a runtime AppImage launcher generator that still writes gpt-voice.desktop with StartupWMClass=gpt-voice.'
      - 'After receiving the recommended canonical migration, the user explicitly instructed Codex to update the specification and plan.'
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [canonical-exact-legacy-migration]
      text: 'AppImage runtime integration writes com.swimmwatch.gptvoice.desktop before shortcut registration, removes only the exact legacy gpt-voice.desktop entry after success, and the removal action cleans both exact names without logging paths.'
    rationale: 'electron-builder metadata alone cannot repair the application-owned launcher used by existing AppImage installations.'
    supersedes_revision: null
    requirement_ids: [PLAT-005, PLAT-007, SEC-002, COMP-005, QUAL-007]

  - id: platform.windows-reservations
    revision: 1
    category: compatibility
    state: answered
    provenance: user
    evidence:
      - 'Microsoft RegisterHotKey documentation reserves F12 and shortcuts involving the Windows modifier for operating-system use.'
      - 'After receiving the recommended policy correction, the user explicitly instructed Codex to update the specification and plan.'
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [f12-and-super-reserved]
      text: 'Windows policy rejects a primary F12 key and every normalized accelerator containing the Super modifier as OsReserved before Electron registration.'
    rationale: 'The pure platform policy should classify documented reservations consistently instead of relying on a generic adapter rejection.'
    supersedes_revision: null
    requirement_ids: [PLAT-001, PLAT-002, QUAL-002, QUAL-008]

