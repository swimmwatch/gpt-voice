  - id: plan.packet-01-null-compatibility-boundary
    revision: 1
    category: scope
    state: answered
    provenance: user
    evidence:
      - 'Changing AppConfigSnapshot and HotkeySettings to string | null makes the current ShortcutController pass null to Electron registration and makes AppSettingsWindow promise a string return value.'
      - 'Packet 01 owns nullable persistence/shared contracts, while Packets 03 and 04 currently own the respective controller and Settings migrations.'
      - 'A minimal null guard in the existing controller and a null-preserving temporary Settings projection make Packet 01 strict-type-safe without introducing the registration service, IPC migration, or final UX.'
    prompt_mcp:
      interview_id: plan:global-hotkey-registration
      batch_id: scope-round-03
      question_id: plan.packet-01-null-compatibility-boundary
      idempotency_key: plan.packet-01-null-compatibility-boundary:v1
      revision: 1
      last_status: answered
    question:
      text: "How should the plan resolve Packet 01's nullable-type boundary with existing registration and Settings consumers?"
      kind: single
      options:
        - id: move-minimal-compatibility-to-packet-01
          label: Move minimal compatibility to Packet 01 (Recommended)
          description: Guard current controller registration against null (including Retry) and render no fallback accelerator for null in Settings; retain the new service, IPC, and final UX work in Packets 03–05.
        - id: merge-with-later-migrations
          label: Merge with later migrations
          description: Move nullable persistence later so Packet 01 stays data-only, enlarging a later packet with persistence and compatibility work.
        - id: split-compatibility-packet
          label: Add a compatibility packet
          description: Insert a dedicated packet between persistence and registration-service work for temporary controller and Settings compatibility.
    answer:
      selected_ids: [move-minimal-compatibility-to-packet-01]
      text: ''
    rationale: 'The user selected the minimal Packet 01 compatibility adjustment: null guards in the legacy controller and a null-preserving temporary Settings projection. The registration service, trusted IPC migration, and final Settings UX remain owned by later packets.'
    supersedes_revision: null
    requirement_ids: [DATA-001, DATA-002, DATA-003, ARCH-005, COMP-001, COMP-002, QUAL-001, AC-AUTO-001]

