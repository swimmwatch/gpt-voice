  - id: workflow.transactional-mutation
    revision: 1
    category: workflow
    state: superseded
    provenance: user
    evidence:
      - 'User approved registration validation, rollback, clear, suppression, and persistent registration behavior.'
    prompt_mcp: null
    question: null
    answer:
      selected_ids: []
      text: 'Replacement is candidate-first and commits only after OS registration and persistence succeed; any failure retains the previous configured and registered shortcut. Clearing is persistence-first. Settings suppresses dispatch without releasing OS bindings.'
    rationale: ''
    supersedes_revision: null
    requirement_ids: [FLOW-002, FLOW-003, FLOW-004, FLOW-005, FLOW-006]

  - id: workflow.transactional-mutation
    revision: 2
    category: workflow
    state: answered
    provenance: user
    evidence:
      - 'The review identified that persistence-first mutation lacked a contract for old-binding or candidate-cleanup failure.'
      - 'After receiving the recommended verified-cleanup and compensation model, the user explicitly instructed Codex to update the specification and plan.'
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [verified-cleanup-compensation]
      text: 'Replacement and clear verify unregister through the registration query, compensate toward the prior authoritative pair when cleanup fails, invalidate stale callback generations, and suppress an irreconcilable target as ReconciliationFailed.'
    rationale: 'This closes the post-persistence state gap without releasing a working binding before the durable write succeeds.'
    supersedes_revision: 1
    requirement_ids: [ARCH-001, ARCH-003, FLOW-003, FLOW-004, FLOW-005, FLOW-006, FLOW-009, FLOW-010, FAIL-002]

