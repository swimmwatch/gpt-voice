  - id: operations.high-frequency-events
    revision: 1
    category: operations
    state: answered
    provenance: user
    evidence:
      - 'Voice streaming accepts many PCM chunks per recording.'
      - 'Translation result acquisition polls repeatedly, and provider automation can perform repeated low-level reads.'
      - 'Logging every loop iteration can generate large logs and create timing noise.'
    prompt_mcp:
      interview_id: spec:provider-audit-logging
      batch_id: diagnostics-round-01
      question_id: operations.high-frequency-events
      idempotency_key: operations.high-frequency-events:v1
      last_status: answered
    question:
      text: 'How should full-lifecycle auditing handle high-frequency chunks and polling loops?'
      kind: single
      options:
        - id: semantic-phases
          label: 'Semantic phases (Recommended)'
          description: 'Log phase boundaries and terminal counters, plus retry/backpressure/anomaly events; do not log every audio chunk, poll, DOM read, or token.'
        - id: sampled-progress
          label: 'Sampled progress'
          description: 'Also emit rate-limited progress summaries during long-running streaming and polling operations.'
        - id: every-boundary-call
          label: 'Every boundary call'
          description: 'Log each accepted chunk, poll, and provider hook invocation, producing the most detail and highest volume.'
    answer:
      selected_ids: [semantic-phases]
      text: ''
    rationale: ''
    supersedes_revision: null
    requirement_ids: [AUD-002, PERF-001]

  - id: operations.severity-policy
    revision: 1
    category: operations
    state: answered
    provenance: user
    evidence:
      - 'The existing file transport persists info and higher levels.'
      - 'Provider outcomes include expected cancellations and validation failures as well as unexpected exceptions and infrastructure failures.'
    prompt_mcp:
      interview_id: spec:provider-audit-logging
      batch_id: diagnostics-round-01
      question_id: operations.severity-policy
      idempotency_key: operations.severity-policy:v1
      last_status: answered
    question:
      text: 'How should audit-event severity distinguish failures?'
      kind: single
      options:
        - id: outcome-based-severity
          label: 'Outcome-based severity (Recommended)'
          description: 'Use info for lifecycle/success/cancellation, warn for typed provider or validation failures, and error for unexpected exceptions, corrupted contracts, or cleanup failures.'
        - id: all-failures-error
          label: 'All failures are errors'
          description: 'Use error for every unsuccessful outcome, including cancellation, stale work, validation, and expected provider rejection.'
        - id: audit-info-only
          label: 'Audit events are info'
          description: 'Emit the normalized audit stream at info and retain separate warn/error logs for failures.'
    answer:
      selected_ids: [outcome-based-severity]
      text: ''
    rationale: ''
    supersedes_revision: null
    requirement_ids: [AUD-003]

  - id: interfaces.correlation
    revision: 1
    category: interfaces
    state: answered
    provenance: user
    evidence:
      - 'Batch voice, prettify, and translation operations do not share one correlation identifier today.'
      - 'Streaming voice already has an operation identifier, while retries and recovery events need to remain attributable to the originating operation.'
    prompt_mcp:
      interview_id: spec:provider-audit-logging
      batch_id: diagnostics-round-01
      question_id: interfaces.correlation
      idempotency_key: interfaces.correlation:v1
      last_status: answered
    question:
      text: 'How should audit events from one provider operation be correlated?'
      kind: single
      options:
        - id: opaque-operation-id
          label: 'Opaque operation ID (Recommended)'
          description: 'Assign a non-content-derived per-operation ID in main and carry it across phases, attempts, recovery, and terminal events.'
        - id: timestamp-and-provider
          label: 'Timestamp + provider'
          description: 'Correlate approximately using log timestamps, provider ID, and operation name without adding an identifier.'
        - id: family-specific-ids
          label: 'Family-specific IDs'
          description: 'Use existing streaming IDs where available and separate ad hoc identifiers for other provider families.'
    answer:
      selected_ids: [opaque-operation-id]
      text: ''
    rationale: ''
    supersedes_revision: null
    requirement_ids: [AUD-004]

  - id: security.error-detail
    revision: 1
    category: security
    state: answered
    provenance: user
    evidence:
      - 'Raw provider messages, stacks, URLs, response bodies, stdout, selected text, transcripts, audio, and credentials can contain sensitive data.'
      - 'Existing safe presentation metadata exposes classification, error name, status, length, and flags without retaining the raw message.'
      - 'Translation already uses typed failure codes and safe phase metadata.'
    prompt_mcp:
      interview_id: spec:provider-audit-logging
      batch_id: diagnostics-round-01
      question_id: security.error-detail
      idempotency_key: security.error-detail:v1
      last_status: answered
    question:
      text: 'What error detail should normalized audit events retain?'
      kind: single
      options:
        - id: strict-allowlist
          label: 'Strict allowlist (Recommended)'
          description: 'Retain typed cause code, safe phase, status code, error class/name, attempt, duration, lengths, and boolean diagnostics only; never retain raw messages, stacks, URLs, bodies, stdout, or content.'
        - id: generated-summary
          label: 'Generated safe summary'
          description: 'Also retain a bounded application-generated summary assembled only from allowlisted enums and numeric fields.'
        - id: redacted-raw-excerpt
          label: 'Redacted raw excerpt'
          description: 'Attempt to redact and retain a bounded excerpt of raw provider or exception text, accepting residual disclosure risk.'
    answer:
      selected_ids: [strict-allowlist]
      text: ''
    rationale: ''
    supersedes_revision: null
    requirement_ids: [SEC-003, AUD-005]

