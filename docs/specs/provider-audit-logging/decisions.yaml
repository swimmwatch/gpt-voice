  - id: scope.event-coverage
    revision: 1
    category: scope
    state: answered
    provenance: user
    evidence:
      - 'Current translation diagnostics record terminal success and failure.'
      - 'Current voice and prettify logs include a mixture of starts, retries, successes, and failures.'
    prompt_mcp:
      interview_id: spec:provider-audit-logging
      batch_id: scope-round-01
      question_id: scope.event-coverage
      idempotency_key: scope.event-coverage:v1
      last_status: answered
    question:
      text: 'Which events should the provider audit trail record?'
      kind: single
      options:
        - id: terminal-and-causal
          label: 'Terminal + causal events (Recommended)'
          description: 'Record one terminal event for every operation and additional retry, recovery, cancellation, or cleanup events only when they explain the outcome.'
        - id: failures-only
          label: 'Failures only'
          description: 'Record only failed provider operations, minimizing volume but omitting successful-operation baselines.'
        - id: full-lifecycle
          label: 'Full lifecycle'
          description: 'Record start, phase transitions, retries, completion, cancellation, and failure for every operation.'
    answer:
      selected_ids: [full-lifecycle]
      text: ''
    rationale: ''
    supersedes_revision: null
    requirement_ids: [AUD-001]

  - id: scope.operation-surfaces
    revision: 1
    category: scope
    state: answered
    provenance: user
    evidence:
      - 'Provider failures also occur during voice authentication/readiness, prettify availability/model lifecycle, and provider shutdown.'
      - 'Limiting coverage to transcribe/prettify/translate would leave several existing provider-error paths outside the audit contract.'
    prompt_mcp:
      interview_id: spec:provider-audit-logging
      batch_id: scope-round-01
      question_id: scope.operation-surfaces
      idempotency_key: scope.operation-surfaces:v1
      last_status: answered
    question:
      text: 'Which provider-owned operations should be covered?'
      kind: single
      options:
        - id: execution-plus-support-failures
          label: 'Execution + support failures (Recommended)'
          description: 'Audit transcribe, prettify, and translate operations, plus failures in provider readiness/auth, availability/model lifecycle, recovery, and shutdown.'
        - id: execution-only
          label: 'Execution only'
          description: 'Audit only transcribe, prettify, and translate calls.'
        - id: all-provider-operations
          label: 'All provider operations'
          description: 'Audit successful and failed execution, readiness/auth, discovery, model lifecycle, recovery, and shutdown operations.'
    answer:
      selected_ids: [all-provider-operations]
      text: ''
    rationale: ''
    supersedes_revision: null
    requirement_ids: [SCOPE-002]

