    question:
      text: 'How should users choose a Prettify transformation when starting the action?'
      kind: single
      options:
        - id: dual-path
          label: 'Quick apply plus editor (Recommended)'
          description: 'F12 immediately applies the active profile, while an explicit editor action opens profile selection, source review, and preview.'
        - id: persistent-quick
          label: 'Persistent quick selection'
          description: 'Users select an active profile in the app, and every F12 press applies it immediately without an editor.'
        - id: choose-every-time
          label: 'Choose every time'
          description: 'F12 always opens a Telegram-like chooser before any provider request.'
    answer:
      selected_ids: []
      text: 'F12 opens a profile chooser and applies the selected profile. A separate configurable shortcut, initially exemplified as Ctrl+F12, immediately applies the default profile without opening the chooser.'
    rationale: ''
    supersedes_revision: null
    requirement_ids: [FLOW-001, FLOW-002]

