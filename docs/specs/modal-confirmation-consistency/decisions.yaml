  - id: outcome.modal-consistency
    revision: 1
    category: outcome
    state: answered
    provenance: user
    evidence:
      - 'User request on 2026-08-08: improve modal confirmation use and display across the app.'
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [cross-app-modal-consistency]
      text: 'Use consistent modal components and appropriate actions throughout the renderer, not only in Local Whisper.'
    rationale: 'The supplied Local Whisper screenshot demonstrates the current raw-action presentation defect.'
    supersedes_revision: null
    requirement_ids: [OUT-001, SCOPE-001]
  - id: scope.modal-types
    revision: 1
    category: scope
    state: answered
    provenance: user
    evidence:
      - 'User selected All modal types during the modal-consistency planning discussion on 2026-08-08.'
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [all-renderer-modal-types]
      text: 'Standardize confirmation and data-entry modal presentation and action hierarchy.'
    rationale: 'Data-entry dialogs retain their existing workflow-specific content and sizing.'
    supersedes_revision: null
    requirement_ids: [SCOPE-001, UI-002]
  - id: ui.action-hierarchy
    revision: 1
    category: interface
    state: answered
    provenance: user
    evidence:
      - 'User selected Outline + red action for destructive confirmations on 2026-08-08.'
      - 'User selected Outline + primary submit for normal dialogs on 2026-08-08.'
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [outline-cancel, destructive-confirm, primary-normal-submit]
      text: 'Place an outline Cancel, Keep, Continue, or Close action first; use destructive red for destructive actions and primary for normal submission.'
    rationale: 'Use the existing Button variants without creating colors or visual primitives.'
    supersedes_revision: null
    requirement_ids: [UI-003, UI-004]
  - id: flow.pending-confirmation
    revision: 1
    category: failure
    state: answered
    provenance: user
    evidence:
      - 'User selected Lock until resolved for pending confirmed actions on 2026-08-08.'
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [lock-until-resolved]
      text: 'Pending modal actions disable dismissal and repeated submission, show progress, close only after success, and remain open after failure.'
    rationale: 'Prevents interruption and duplicate destructive work.'
    supersedes_revision: null
    requirement_ids: [FLOW-003, FAIL-001]
  - id: ui.dismissal-affordance
    revision: 1
    category: interface
    state: answered
    provenance: user
    evidence:
      - 'User selected Footer action only during modal-consistency planning on 2026-08-08.'
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [footer-dismissal-only]
      text: 'Modal workflows use their footer Cancel or Close button as the sole visible dismissal affordance.'
    rationale: 'Remove the redundant Hotkey header close button.'
    supersedes_revision: null
    requirement_ids: [UI-005]
  - id: local-whisper.removal-title
    revision: 1
    category: localization
    state: answered
    provenance: user
