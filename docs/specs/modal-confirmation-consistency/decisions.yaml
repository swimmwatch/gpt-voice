  - id: a11y.failed-confirmation-focus
    revision: 1
    category: accessibility
    state: answered
    provenance: user
    evidence:
      - 'User selected Lock until resolved during modal-consistency planning on 2026-08-08; the selected behavior keeps a failed confirmation open.'
      - 'Radix AlertDialog focus containment requires focus to remain inside an open modal.'
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [retain-in-dialog-focus]
      text: 'A failed confirmation remains open and keeps focus on safe in-dialog error or confirmation content; only cancellation or success restores focus to the initiator.'
    rationale: 'Resolves the previous conflict between failure retention and trigger focus restoration without changing the approved user outcome.'
    supersedes_revision: null
    requirement_ids: [FLOW-002, FLOW-004, A11Y-001]
