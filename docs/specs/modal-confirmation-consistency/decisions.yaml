      text: 'AlertDialog and Dialog duplicate surface/layout rules. Local Whisper artifact removal uses unstyled raw Radix actions; other call sites have inconsistent pending and close handling.'
    rationale: 'The existing shared Button exposes outline, primary, and destructive variants needed by this work.'
    supersedes_revision: null
    requirement_ids: [ARCH-001, UI-001]
