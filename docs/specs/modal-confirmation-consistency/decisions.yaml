      - 'src/renderer/components/ui/dialog.tsx'
      - 'src/renderer/components/ui/button.tsx'
      - 'src/renderer/localWhisper/components/LocalWhisperArtifactControls.tsx'
    prompt_mcp: null
    question: null
    answer:
