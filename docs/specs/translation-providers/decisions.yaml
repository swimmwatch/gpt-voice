    supersedes_revision: null
    requirement_ids: [ARCH-007, RUN-013, SEC-002, SEC-006]

  - id: research.bing-live-2026-07-25
    revision: 1
    category: acceptance
    state: observed
    provenance: authoritative-doc
    evidence:
      - A fresh CloakBrowser MCP run on 2026-07-25 loaded Bing Translator anonymously and completed two bounded synthetic translations.
      - Native source and target selects exposed en, ru, uk, and be; source auto-detection used auto-detect.
      - The source was a contenteditable textbox, the result changed and stabilized, and the public clear control removed both source and result.
      - Source text did not enter the top-level URL or Back history during the run.
      - Provider cookies, local storage, telemetry, and a previously observed inert first-load state still require isolation and bounded readiness handling.
    answer:
      selected_ids: [executable-with-bounded-readiness]
      text: ''
    rationale: Bing has current executable evidence but a loaded DOM alone is not sufficient readiness evidence.
    supersedes_revision: null
    requirement_ids: [BING-002, BING-005, BING-006, BING-007]

  - id: research.yandex-live-2026-07-25
    revision: 1
    category: security
    state: observed
    provenance: authoritative-doc
    evidence:
      - A fresh CloakBrowser MCP run on 2026-07-25 loaded Yandex Translate anonymously and completed bounded synthetic translations with automatic source detection.
      - The public page exposed contenteditable source and result controls, a 10,000-character advertised limit, and language controls covering the current product targets.
      - Full source text entered the top-level URL and browser history.
      - Provider telemetry and local-storage/history surfaces also handled translation data after essential-cookie consent was chosen.
      - Clearing the visible editor removed the current text parameter but does not establish provider-side deletion.
    answer:
      selected_ids: [executable-with-source-retention-risk]
      text: ''
    rationale: Technical feasibility does not resolve whether GPT-Voice should enable this privacy posture.
    supersedes_revision: null
    requirement_ids: [YNDX-002, YNDX-004, YNDX-006, YNDX-007, YNDX-008]

  - id: research.deepl-live-2026-07-25
    revision: 1
    category: acceptance
    state: observed
    provenance: authoritative-doc
    evidence:
      - A fresh CloakBrowser MCP run on 2026-07-25 loaded the anonymous DeepL translator shell and identified public source, result, and language-control candidates.
      - Rejecting optional cookies did not remove a connection-security overlay backed by clearance.deepl.com.
      - The challenge persisted through one bounded wait and intercepted translator interaction.
      - No source text persisted, no translation request completed, and no result, clear flow, executable language mapping, or input limit was proven.
      - DOM-only inspection behind the overlay is structural evidence only and is excluded from executable rollout evidence.
    answer:
      selected_ids: [blocked-by-connection-security-challenge]
      text: ''
    rationale: DeepL must fail closed unless a future application-equivalent canary succeeds without solving or suppressing the challenge.
    supersedes_revision: null
    requirement_ids: [UI-002, OPS-002, COMP-004]

  - id: research.bing-language-inventory
    revision: 1
    category: interfaces
    state: observed
    provenance: authoritative-doc
    evidence:
      - A no-text-submission CloakBrowser pass on 2026-07-25 found 179 unique Bing target codes and one dynamic duplicate in the Recently used group.
      - The source inventory matched the target inventory plus the source-only auto-detect value.
      - Descendant option values are stable extraction keys; labels and optgroup position may localize or vary by session.
    answer:
      selected_ids: [179-targets]
      text: ''
    rationale: The checked-in inventory must deduplicate exact codes and ignore dynamic recently-used groups and order.
    supersedes_revision: null
    requirement_ids: [BING-001, BING-003, LANG-002, LANG-003]

  - id: research.yandex-language-inventory
    revision: 1
    category: interfaces
    state: observed
    provenance: authoritative-doc
    evidence:
