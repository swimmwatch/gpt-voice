      - The source inventory matched the target inventory; automatic detection is a separate switch.
      - Stable public attributes expose provider codes and labels, while the inactive duplicate inventory remains mounted and must be excluded.
    answer:
      selected_ids: [118-targets]
      text: ''
    rationale: The checked-in inventory must scope extraction to the visible chooser and preserve provider-specific codes and fallback labels.
    supersedes_revision: null
    requirement_ids: [YNDX-001, LANG-002, LANG-003, LANG-004]

