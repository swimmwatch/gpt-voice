  - id: operations.language-change-reporting
    revision: 1
    category: failure
    state: answered
    provenance: user
    evidence:
      - A blocked or broken probe does not prove that a provider language set changed.
      - The custom answer requires an issue immediately when an actual set change is detected.
    prompt_mcp:
      interview_id: spec:translation-providers
      batch_id: language-monitor-round-01
      question_id: operations.language-change-reporting
      idempotency_key: operations.language-change-reporting:v1
      last_status: answered
      revision: 1
    question:
      text: When should the workflow create a language-change issue?
      kind: single
      options:
        - id: first-confirmed-diff
          label: First confirmed difference (Recommended)
          description: Create an issue after one successful probe returns a changed set; a challenge or probe failure fails the job but is not reported as language drift.
        - id: any-anomaly
          label: Any anomaly
          description: Create an issue for either a changed set or any challenge, selector failure, or unavailable provider.
        - id: two-confirmed-diffs
          label: Two consecutive differences
          description: Require the same changed set in two scheduled runs before creating an issue, reducing false positives but delaying notification.
    answer:
      selected_ids: [first-confirmed-diff]
      text: ''
    rationale: ''
    supersedes_revision: null
    requirement_ids: [OPS-007]

