  - id: security.context-lifecycle
    revision: 1
    category: security
    state: answered
    provenance: user
    evidence:
      - Google and Yandex place source text in browser history, while Bing and DeepL create provider cookies, storage, or telemetry state.
      - The current Google implementation shares the persistent background browser context used by voice providers.
    prompt_mcp:
      interview_id: spec:translation-providers
      batch_id: provider-policy-round-01
      question_id: security.context-lifecycle
      idempotency_key: security.context-lifecycle:v1
      last_status: answered
      revision: 1
    question:
      text: Which browser-context lifecycle should translation operations use?
      kind: single
      options:
        - id: isolated-per-operation
          label: Isolate every operation (Recommended)
          description: Use one dedicated nonpersistent context per hotkey operation, never share voice-provider state, and require confirmed teardown before success.
        - id: isolated-per-provider-session
          label: Reuse by provider
          description: Keep one nonpersistent context per translation provider until app exit, reducing startup work while retaining history and storage across operations.
        - id: shared-background-profile
          label: Share background profile
          description: Keep the current persistent background context, accepting cross-operation and cross-feature browser retention.
    answer:
      selected_ids: [isolated-per-provider-session]
      text: ''
    rationale: ''
    supersedes_revision: null
    requirement_ids: [ARCH-006, ARCH-007, ARCH-008, SEC-006]

  - id: rollout.yandex
    revision: 1
    category: security
    state: answered
    provenance: user
    evidence:
      - Yandex completed translation but copied plaintext source into the top-level URL, browser history, provider telemetry, and local history/settings surfaces.
      - Local context destruction cannot establish provider-side deletion or retention limits.
    prompt_mcp:
      interview_id: spec:translation-providers
      batch_id: provider-policy-round-01
      question_id: rollout.yandex
      idempotency_key: rollout.yandex:v1
      last_status: answered
      revision: 1
    question:
      text: How should the first release expose Yandex given its observed source-retention behavior?
      kind: single
      options:
        - id: visible-disabled
          label: Visible but disabled (Recommended)
          description: Implement and test the provider contract, but keep it unselectable with a localized privacy explanation until a later explicit enablement decision.
        - id: explicit-opt-in
          label: Require explicit opt-in
          description: Make Yandex selectable only after a persistent in-app acknowledgement of its URL, history, telemetry, and uncertain provider-side retention.
        - id: enabled-default
          label: Enable immediately
          description: Make Yandex selectable without an extra gate, explicitly accepting the observed transport and retention risks.
    answer:
      selected_ids: [enabled-default]
      text: ''
    rationale: The user explicitly accepted immediate enablement after reviewing the observed data surfaces.
    supersedes_revision: null
    requirement_ids: [UI-002, YNDX-008, SEC-007]

  - id: rollout.deepl
    revision: 1
    category: acceptance
    state: answered
    provenance: user
    evidence:
      - Two research dates encountered a blocking connection-security challenge in application-equivalent CloakBrowser.
      - No successful source insertion, translation, executable language mapping, result extraction, clear flow, or input limit has been proven.
    prompt_mcp:
      interview_id: spec:translation-providers
      batch_id: provider-policy-round-01
      question_id: rollout.deepl
      idempotency_key: rollout.deepl:v1
      last_status: answered
      revision: 1
    question:
      text: How should the first release expose DeepL while its browser flow remains unproven behind a connection-security challenge?
      kind: single
      options:
        - id: visible-disabled
          label: Visible but disabled (Recommended)
          description: Implement its fail-closed class and metadata, but keep it unselectable until a challenge-free CloakBrowser canary proves the complete contract.
        - id: selectable-fail-closed
          label: Selectable with failures
          description: Allow selection now, attempt each operation once, and return a safe challenge error whenever the page blocks automation.
        - id: defer-provider
          label: Defer DeepL entirely
          description: Exclude DeepL implementation and UI from this work until executable research is available.
    answer:
      selected_ids: [defer-provider]
      text: ''
    rationale: This supersedes the original DeepL implementation request for the current specification.
    supersedes_revision: null
    requirement_ids: [UI-002, OPS-002, COMP-004]

  - id: scope.language-availability
    revision: 1
    category: scope
    state: answered
    provenance: user
    evidence:
      - The current product exposes en, ru, uk, and be.
      - Bing and Yandex expose those four targets; DeepL has no executable target mapping, and its public list omits Belarusian.
    prompt_mcp:
      interview_id: spec:translation-providers
      batch_id: provider-policy-round-01
      question_id: scope.language-availability
      idempotency_key: scope.language-availability:v1
      last_status: answered
      revision: 1
    question:
      text: How should target-language choices vary across translation providers?
      kind: single
      options:
        - id: provider-specific-evidence
          label: Evidence-backed per provider (Recommended)
          description: Show only each enabled provider's executable, validated targets; disabled or unproven providers expose no runnable language choice.
        - id: common-intersection
          label: One common set
          description: Restrict every provider to the proven common set, currently English, Russian, and Ukrainian, dropping Belarusian from the product.
        - id: fixed-current-four
          label: Keep all four everywhere
          description: Always show English, Russian, Ukrainian, and Belarusian, disabling or rejecting combinations a provider cannot execute.
    answer:
      selected_ids:
        - provider-specific-maintained
        - scheduled-language-monitor
        - create-github-issue-on-change
      text: Maintain a supported-language inventory for every in-scope provider, periodically check for changes in GitHub Actions, and create an issue whenever any inventory changes.
    rationale: The custom answer expands the work to durable provider inventories and automated change detection.
    supersedes_revision: null
    requirement_ids: [UI-003, LANG-001, LANG-005, LANG-006, OPS-001]

  - id: compatibility.language-memory
    revision: 1
    category: compatibility
    state: answered
    provenance: user
    evidence:
      - config.json currently stores one targetLang value and no translation-provider ID.
      - Provider-specific language sets can make one global language invalid after a provider switch.
    prompt_mcp:
      interview_id: spec:translation-providers
      batch_id: provider-policy-round-01
      question_id: compatibility.language-memory
      idempotency_key: compatibility.language-memory:v1
      last_status: answered
      revision: 1
    question:
      text: What target-language state should provider switching preserve?
      kind: single
      options:
        - id: remember-per-provider
          label: Remember per provider (Recommended)
          description: Persist one target language per provider; migrate the current target to Google and seed other providers only with a compatible value or their default.
        - id: single-global
          label: Keep one global language
          description: Reuse one target across providers and require switch-time validation or fallback when the new provider does not support it.
        - id: reset-english
          label: Reset to English
          description: Set the target to English whenever the translation provider changes.
    answer:
      selected_ids: [remember-per-provider]
      text: ''
    rationale: ''
    supersedes_revision: null
    requirement_ids: [SET-002, SET-003, SET-005]

