    question:
      text: How should remediation bound accepted archive data and normalized inspector output?
      kind: single
      options:
        - id: reduce-acceptance-limits
          label: Reduce acceptance limits (Recommended)
          description: Limit members to 64 MiB, total payload to 128 MiB, JSONL to 100,000 records, structural metadata to 1 MiB, and normalized output to 1 MiB/10,000 evidence items with omission counts.
        - id: preserve-archive-limits
          label: Preserve archive limits
          description: Keep 128 MiB member, 256 MiB total, and 1,000,000-record acceptance while streaming in bounded memory; cap structural metadata at 1 MiB and normalized output at 1 MiB/10,000 evidence items with omission counts.
    answer:
      selected_ids: [reduce-acceptance-limits]
      text: ''
    rationale: Reduce accepted payload and record limits as well as bounding structural metadata and normalized output to protect the inspector and agent host.
    supersedes_revision: null
    requirement_ids: [SEC-003, SEC-005, COMP-003]

