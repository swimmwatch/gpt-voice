  - id: outcome.fix_until_green
    revision: 1
    category: outcome
    state: superseded
    provenance: user
    evidence: []
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [monitor-diagnose-fix-repeat]
      text: >-
        The watch scenario monitors the selected CI contract, diagnoses related
        failures, applies minimal fixes, verifies them locally, commits and
        pushes them, and repeats for subsequent runs until the contract is green
        or a defined blocking condition is reached.
    rationale: The user explicitly required the watcher to fix, not only report, subsequent CI failures.
    supersedes_revision: null
    requirement_ids: [OUT-001, FLOW-001]

