  - id: repair.rollback_policy
    revision: 1
    category: failure
    state: answered
    provenance: user
    evidence:
      - AGENTS.md
    prompt_mcp:
      interview_id: spec:ci-watch-agent-skill
      batch_id: operations-round-04
      question_id: repair.rollback_policy
      idempotency_key: repair.rollback_policy:v1
      last_status: answered
      display_language: ru
    question:
      text: >-
        Как watcher должен обращаться со своим незавершённым patch после
        неудачной локальной проверки, чтобы не потерять полезную работу и не
        затронуть внешние изменения в той же рабочей директории?
      kind: single
      options:
        - id: transactional-owned-patch
          label: Транзакционный owned patch (Рекомендуется)
          description: >-
            До изменения сохранять hashes и приватный patch; после ошибки
            исправлять текущий patch вперёд, а при отказе от подхода обращать
            только точно принадлежащие watcher изменения. Запретить git restore
            и временные commits; любое внешнее изменение блокирует автоматический
            rollback.
        - id: forward-only
          label: Только исправление вперёд
          description: >-
            Никогда автоматически не откатывать patch; сохранять его и
            продолжать исправление либо остановиться для пользователя.
        - id: temporary-commits
          label: Временные commits
          description: >-
            Делать checkpoint commits для каждой попытки и затем откатывать или
            переписывать их, что упрощает восстановление, но загрязняет историю
            и конфликтует с атомарной delivery.
    answer:
      selected_ids: [forward-only]
      text: >-
        Нужно локально довести работу до конца, если не удается остановиться и
        позвать пользователя.
    rationale: >-
      Normalize the custom answer as forward-only repair: keep improving the
      current owned patch locally; if safe completion is not possible, preserve
      it, stop, and ask the user rather than automatically rolling it back.
    supersedes_revision: null
    requirement_ids: [REPAIR-001, REPAIR-002, REPAIR-003]

