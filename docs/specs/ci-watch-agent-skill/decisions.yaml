  - id: orchestration.goal_and_stop_hook
    revision: 1
    category: architecture
    state: superseded
    provenance: user
    evidence:
      - https://learn.chatgpt.com/docs/hooks
      - https://learn.chatgpt.com/docs/long-running-work
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [goal-and-synchronous-stop-hook]
      text: >-
        Each active watch session is represented by a persistent Codex Goal and
        is resumed by a synchronous Stop hook that emits a bounded deterministic
        continuation prompt only when runtime state requires agent work.
    rationale: Background hooks cannot steer the agent, while a synchronous Stop hook can create a continuation prompt.
    supersedes_revision: null
    requirement_ids: [ARCH-002, FLOW-002]

  - id: orchestration.token_free_wait
    revision: 1
    category: performance
    state: superseded
    provenance: user
    evidence:
      - https://learn.chatgpt.com/docs/hooks
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [deterministic-process-wait]
      text: >-
        A deterministic local watcher waits for GitHub CI and updates state
        without model calls. The model is resumed only for terminal failure,
        blocking, cancellation, or completion handling.
    rationale: This minimizes both token consumption and active agent time while CI is running.
    supersedes_revision: null
    requirement_ids: [PERF-001, FLOW-003]

  - id: lifecycle.install_once_runtime_state
    revision: 1
    category: operations
    state: superseded
    provenance: user
    evidence: []
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [tracked-assets-once-runtime-per-watch]
      text: >-
        The skill, hook configuration, scripts, references, and scenario schemas
        are installed once. A normal invocation creates or updates only ignored,
        per-watch runtime state.
    rationale: Repeated watch sessions should not rewrite tracked infrastructure.
    supersedes_revision: null
    requirement_ids: [OPS-002, DATA-001]

  - id: flow.failure_repair_cycle
    revision: 1
    category: normal-flow
    state: superseded
    provenance: user
    evidence: []
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [fetch-once-fix-verify-commit-push-rebind]
      text: >-
        For each failed exact-SHA run, fetch failed logs once, diagnose all
        related errors, make the smallest coherent fixes, run scenario-relevant
        local checks, create atomic commits, push the current branch, locate or
        dispatch the next authorized run, bind it to the new exact SHA, and wait
        again.
    rationale: This is the complete autonomous repair loop requested by the user.
    supersedes_revision: null
    requirement_ids: [FLOW-004, GIT-001, GIT-002]

  - id: flow.failure_fingerprints
    revision: 1
    category: failure
    state: superseded
    provenance: user
    evidence: []
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [stable-fingerprint]
      text: >-
        Sanitized failure fingerprints prevent duplicate log downloads for the
        same run and identify repeated blockers across repair cycles.
    rationale: The watcher must avoid wasting tokens on unchanged evidence and must terminate safely when progress stalls.
    supersedes_revision: null
    requirement_ids: [FAIL-001, DATA-002]

  - id: integrity.exact_sha
    revision: 1
    category: security
    state: superseded
    provenance: user
    evidence: []
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [exact-expected-sha]
      text: >-
        Success is valid only when all scenario-required checks belong to the
        exact expected commit SHA. The watcher distinguishes its own pushed SHAs
        from unexpected externally produced branch-head changes.
    rationale: Branch-level green status could otherwise accept stale or unrelated results.
    supersedes_revision: null
    requirement_ids: [SAFE-002, ACCEPT-001]

  - id: authorization.allowed_mutations
    revision: 1
    category: security
    state: superseded
    provenance: user
    evidence:
      - https://learn.chatgpt.com/docs/long-running-work
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [bounded-fix-commit-push-rerun]
      text: >-
        Explicit `$watch-ci` invocation authorizes only scenario-scoped source
        fixes, relevant local verification, atomic commits, a normal push of the
        current branch, and safe scenario-declared CI run location or dispatch.
        Codex sandbox, approval, repository, and branch-protection policies still
        apply.
    rationale: Goal mode does not broaden the host's sandbox or approval policy.
    supersedes_revision: null
    requirement_ids: [SAFE-003]

  - id: authorization.forbidden_mutations
    revision: 1
    category: security
    state: superseded
    provenance: user
    evidence: []
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [deny-release-and-destructive-actions]
      text: >-
        Watch mode never authorizes force-push, merge, tags, releases,
        publication, protected-environment approval, weakened or skipped checks,
        arbitrary workflow inputs, or `publish=true`.
    rationale: Monitoring and repair must not silently become release or destructive automation.
    supersedes_revision: null
    requirement_ids: [SAFE-004]

  - id: concurrency.one_watcher_per_worktree
    revision: 1
    category: concurrency
    state: answered
    provenance: user
    evidence:
      - https://learn.chatgpt.com/docs/long-running-work
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [single-writer-worktree]
      text: >-
        Only one active watcher may own a worktree. Parallel watch tasks require
        separate worktrees and independent Codex chats/goals.
    rationale: This prevents concurrent automated edits, commits, and branch-state corruption.
    supersedes_revision: null
    requirement_ids: [CONC-001]

