      text: The capability is invoked only by an explicit `$watch-ci` user request.
    rationale: Explicit invocation prevents ordinary CI discussion from starting autonomous repair work.
    supersedes_revision: null
    requirement_ids: [SCOPE-001, SAFE-001]

