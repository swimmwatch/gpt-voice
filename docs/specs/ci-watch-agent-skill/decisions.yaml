    question:
      text: >-
        Decide whether an active watcher may automatically adopt a branch-head
        commit that was not produced by that watcher.
      kind: single
      options:
        - id: stop-and-resume
          label: Stop and require explicit resume
          description: Preserve exact-SHA ownership and require the user to accept the new external head.
        - id: follow-automatically
          label: Follow the external head automatically
          description: Continue only after confirming a clean worktree and an unchanged scenario contract.
