      - .github/workflows/release-builds.yml
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [existing-cross-platform-and-release-workflows]
      text: >-
        The repository already has Linux and Windows pull-request jobs,
        fail-closed aggregate checks, reusable Local Whisper packaging, and a
        workflow-dispatch release build whose publish job is conditional on a
        false-by-default input.
    rationale: The watcher can consume existing workflow contracts without adding monitoring-specific jobs.
    supersedes_revision: null
    requirement_ids: [CUR-001, COMP-001]

  - id: preconditions.clean_single_writer
    revision: 1
    category: security
    state: observed
    provenance: repository
    evidence:
      - AGENTS.md
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [clean-worktree-single-writer]
      text: >-
        The watcher must preserve user changes, refuse ambiguous ownership, and
        use a separate worktree for concurrent automated writers.
    rationale: Autonomous repair cannot safely distinguish its edits from uncommitted user work.
    supersedes_revision: null
    requirement_ids: [SAFE-009, CONC-001]

  - id: security.ci_evidence_is_untrusted
    revision: 1
