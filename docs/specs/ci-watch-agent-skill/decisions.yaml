  - id: failure.repeated_fingerprint_limit
    revision: 2
    category: failure
    state: answered
    provenance: user
    evidence: []
    prompt_mcp:
      interview_id: spec:ci-watch-agent-skill
      batch_id: behavior-round-02
      question_id: failure.repeated_fingerprint_limit
      idempotency_key: failure.repeated_fingerprint_limit:v2
      last_status: answered
      display_language: ru
    question:
      text: >-
        Select the circuit-breaker threshold for consecutive repair cycles that
        end with the same normalized failure fingerprint.
      kind: single
      options:
        - id: three-cycles
          label: Stop after three repeated cycles
          description: Balance autonomous repair with protection against an unproductive infinite loop.
        - id: five-cycles
          label: Stop after five repeated cycles
          description: Permit more autonomous attempts at the cost of additional time and tokens.
        - id: no-limit
          label: Do not limit repetitions
          description: Continue until success, cancellation, or another non-recoverable condition.
    answer:
      selected_ids: [no-limit]
      text: >-
        Correctly distinguish a new failure from the same failure, but do not
        stop merely because one fingerprint repeats a fixed number of times.
        Continue toward the defined result unless the user cancels, authority is
        required, or an objectively non-recoverable blocker prevents meaningful
        progress.
    rationale: An arbitrary retry count would contradict the purpose of a fix-until-green watch session.
    supersedes_revision: 1
    requirement_ids: [FAIL-004]

