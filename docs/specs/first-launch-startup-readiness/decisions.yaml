  - id: plan.startup-coordinator-placement
    revision: 1
    category: architecture
    state: answered
    provenance: user
    evidence:
      - src/main/mainProcessApplication.ts:195-214
      - src/main/cloakbrowser.ts:29-74
      - src/main/ipc.ts:137-177
    prompt_mcp:
      interview_id: plan:first-launch-startup-readiness
      batch_id: architecture-round-01
      question_id: plan.startup-coordinator-placement
      idempotency_key: plan.startup-coordinator-placement:v1
      last_status: answered
    question:
      text: 'Where should the first-launch startup state and retry lifecycle be owned?'
      kind: single
      options:
        - id: dedicated-coordinator
          label: Dedicated coordinator (Recommended)
          description: 'Add one injected main-process coordinator that owns job generations, immutable snapshots, runtime preparation, and retry; MainProcessApplication only starts it and IPC exposes it.'
        - id: application-owned
          label: Application-owned state
          description: 'Add startup state and retry behavior directly to MainProcessApplication, keeping fewer classes but coupling lifecycle, job tracking, and IPC integration.'
    answer:
      selected_ids: [dedicated-coordinator]
      text: ''
    rationale: 'Both approaches satisfy the approved behavior; the ownership choice determines task boundaries and tests without changing the product contract.'
    supersedes_revision: null
    requirement_ids: [FLR-008, FLR-009, FLR-010, FLR-014]
