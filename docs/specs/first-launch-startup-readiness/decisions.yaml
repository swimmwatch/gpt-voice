  - id: presentation.react-startup-loader-handoff
    revision: 1
    category: presentation
    state: answered
    provenance: user
    evidence:
      - The user-approved Translation Provider Switching and Startup Loader plan on 2026-08-10.
    prompt_mcp: null
    question: null
    answer:
      selected_ids: [localized-react-loader-after-bootstrap]
      text: 'The static bootstrap shell yields as soon as React and localization are ready, so the existing startup loader displays real current stages until startup work reaches a terminal state.'
    rationale: 'The static shell cannot truthfully provide localized dynamic progress; the existing React startup state can.'
    supersedes_revision: null
