          description: 'Attach only values obtained through the current authenticated GPT-Voice flow and never invent or extract them from another application.'
        - id: require-both
          label: 'Require both'
          description: 'Block requests unless both values are present.'
        - id: omit-both
          label: 'Omit both'
          description: 'Never send account or integrity state.'
