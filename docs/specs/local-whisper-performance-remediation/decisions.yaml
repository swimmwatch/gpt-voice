      batch_id: scope-round-01
      question_id: scope.native-remediation-dependency
      idempotency_key: scope.native-remediation-dependency:v1
      last_status: answered
    question:
      text: How should this specification depend on the approved native remediation work that owns resource safety, exact LIST behavior, and common SHA-256 consolidation?
      kind: single
      options:
        - id: require-prerequisites
          label: Require prerequisites (Recommended)
          description: Performance changes may start only after the overlapping native remediation acceptance criteria pass.
        - id: allow-co-development
          label: Allow co-development
          description: Work may proceed together, but performance completion remains blocked on the shared safety gates.
        - id: independent-workstream
          label: Keep independent
          description: Performance work may modify the same native areas without waiting for the approved remediation packets.
    answer:
      selected_ids: [require-prerequisites]
      text: ''
    rationale: Performance work must build on the accepted resource, LIST, and common-SHA safety properties instead of competing with unfinished remediation in the same native boundaries.
    supersedes_revision: null
    requirement_ids: [GAT-001]

  - id: scope.digest-cache-policy
    revision: 1
    category: scope
    state: answered
    provenance: user
    evidence:
      - docs/reviews/2026-08-08-local-whisper-performance-comments-to-address.md
