          description: Require a statistically distinguishable component improvement and no distinguishable regression, without fixed percentages.
    answer:
      selected_ids: [strong-twenty-five-three]
      text: ''
    rationale: Each targeted component must improve by at least 25% while end-to-end time and peak resources remain within a 3% non-regression guardrail outside measurement uncertainty.
