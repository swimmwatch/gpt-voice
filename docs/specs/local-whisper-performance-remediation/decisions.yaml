    prompt_mcp:
      interview_id: spec:local-whisper-performance-remediation
      batch_id: scope-round-01
      question_id: scope.digest-cache-policy
      idempotency_key: scope.digest-cache-policy:v1
      last_status: answered
    question:
      text: Should this performance specification preserve or revise the existing prohibition on metadata-keyed file-digest caching?
      kind: single
      options:
        - id: preserve-no-cache
          label: Preserve no-cache policy (Recommended)
          description: Optimize proof count and hashing throughput without authorizing a metadata-keyed digest cache or metadata-only startup proof.
        - id: allow-process-cache
          label: Allow process-local cache
          description: Revise the contract to allow an identity-anchored cache within one app process with strict invalidation and no persistence.
        - id: allow-persistent-cache
          label: Allow persistent cache
          description: Permit digest reuse across launches using platform identity and metadata with an explicit migration and invalidation contract.
    answer:
      selected_ids: [preserve-no-cache]
      text: ''
    rationale: The performance contract will optimize repeated work and digest throughput without weakening startup integrity or adding mutable metadata cache authority.
    supersedes_revision: null
    requirement_ids: [SCP-004, SEC-003]

