      kind: single
      options:
        - id: balanced-ten-five
          label: 10% gain / 5% guardrail (Recommended)
          description: Require at least a 10% median improvement in the targeted measured component and reject more than a 5% end-to-end or peak-resource regression outside uncertainty.
        - id: strong-twenty-five-three
