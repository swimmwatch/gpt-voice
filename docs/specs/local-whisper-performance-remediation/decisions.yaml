      last_status: answered
    question:
      text: Which repeated model-content proofs may this specification authorize removing?
      kind: single
      options:
        - id: immediate-list-only
          label: Immediate LIST duplicate only (Recommended)
          description: Reuse the acquisition result but retain pre-spawn, pre-load, native authority, preflight, and loader-consumption proofs; accelerate remaining hashes.
        - id: include-linux-native-duplicate
