<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <style>
      html {
        background: #181a1b;
        color-scheme: dark;
      }

      body {
        margin: 0;
        background: #181a1b;
        cursor: progress;
      }

      body[data-window-startup='ready'] {
        cursor: auto;
      }

      #window-startup-loader {
        position: fixed;
        z-index: 2147483647;
        inset: 0;
        display: grid;
        place-items: center;
        background: #181a1b;
        cursor: progress;
        opacity: 1;
        transition:
          opacity 120ms ease-out,
          visibility 0s linear 120ms;
      }

      #window-startup-loader[data-state='ready'] {
        visibility: hidden;
        pointer-events: none;
        opacity: 0;
      }

      .window-startup-main-shell {
        position: relative;
        width: min(520px, calc(100vw - 40px));
        box-sizing: border-box;
        padding: 20px;
        overflow: hidden;
        border: 1px solid rgb(68 71 72 / 70%);
        border-radius: 24px;
        background: rgb(32 34 35 / 94%);
        box-shadow: 0 25px 50px -12px rgb(0 0 0 / 28%);
      }

      .window-startup-main-shell::before,
      .window-startup-main-shell::after {
        position: fixed;
        z-index: -1;
        width: 288px;
        height: 288px;
        border-radius: 50%;
        background: rgb(43 96 203 / 10%);
        content: '';
        filter: blur(56px);
      }

      .window-startup-main-shell::before {
        top: -112px;
        left: -80px;
      }

      .window-startup-main-shell::after {
        right: -64px;
        bottom: -128px;
      }

      .window-startup-main-header {
        display: flex;
        align-items: flex-start;
        gap: 16px;
      }

      .window-startup-main-mark {
        display: grid;
        width: 48px;
        height: 48px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 16px;
        background: #2b60cb;
        box-shadow: 0 10px 24px rgb(43 96 203 / 20%);
        color: #fff;
      }

      .window-startup-main-mark svg {
        width: 20px;
        height: 20px;
      }

      .window-startup-main-heading {
        min-width: 0;
        flex: 1;
        padding-top: 1px;
      }

      .window-startup-main-title {
        margin: 0;
        color: #f4f4f5;
        font-family:
          'Ubuntu Sans',
          Ubuntu,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.4;
      }

      .window-startup-skeleton-line {
        height: 8px;
        border-radius: 999px;
        background: #444748;
        opacity: 0.72;
      }

      .window-startup-main-heading .window-startup-skeleton-line {
        width: 148px;
        margin-top: 9px;
      }

      .window-startup-main-progress {
        height: 6px;
        margin-top: 20px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(244 244 245 / 10%);
      }

      .window-startup-main-progress::after {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: rgb(43 96 203 / 45%);
        content: '';
      }

      .window-startup-stage-grid {
        display: grid;
        margin-top: 20px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .window-startup-stage-placeholder {
        min-width: 0;
        padding: 14px;
        border: 1px solid rgb(68 71 72 / 60%);
        border-radius: 12px;
        background: rgb(24 26 27 / 40%);
      }

      .window-startup-stage-placeholder-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .window-startup-stage-placeholder-icon {
        width: 36px;
        height: 36px;
        flex: 0 0 auto;
        border-radius: 8px;
        background: rgb(244 244 245 / 6%);
      }

      .window-startup-stage-placeholder-row .window-startup-skeleton-line {
        width: min(104px, 58%);
      }

      .window-startup-stage-placeholder-track {
        height: 4px;
        margin-top: 12px;
        border-radius: 999px;
        background: rgb(244 244 245 / 10%);
      }

      .window-startup-stage-placeholder-value {
        width: 34px;
        height: 6px;
        margin-top: 8px;
        margin-left: auto;
        border-radius: 999px;
        background: #303233;
      }

      #window-startup-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #737679;
        border-top-color: #f4f4f5;
        border-radius: 50%;
        animation: window-startup-spin 1s linear infinite;
      }

      @keyframes window-startup-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #window-startup-loader {
          transition: none;
        }

        #window-startup-spinner {
          animation: none;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .window-startup-main-progress::after,
        .window-startup-main-shell .window-startup-skeleton-line,
        .window-startup-stage-placeholder-icon,
        .window-startup-stage-placeholder-value {
          animation: window-startup-pulse 1.4s ease-in-out infinite;
        }
      }

      @keyframes window-startup-pulse {
        50% {
          opacity: 0.42;
        }
      }
    </style>
    <title><%= htmlWebpackPlugin.options.title || 'GPT-Voice' %></title>
  </head>
  <body>
    <div aria-label="Loading" id="window-startup-loader" role="status">
      <% if (htmlWebpackPlugin.options.startupShell === 'main') { %>
      <div aria-hidden="true" class="window-startup-main-shell">
        <div class="window-startup-main-header">
          <div class="window-startup-main-mark">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                d="M12 3l1.1 3.4a4 4 0 0 0 2.5 2.5L19 10l-3.4 1.1a4 4 0 0 0-2.5 2.5L12 17l-1.1-3.4a4 4 0 0 0-2.5-2.5L5 10l3.4-1.1a4 4 0 0 0 2.5-2.5L12 3Z"
              />
              <path d="M5 3v4M3 5h4M19 17v4M17 19h4" />
            </svg>
          </div>
          <div class="window-startup-main-heading">
            <p class="window-startup-main-title">GPT-Voice</p>
            <div class="window-startup-skeleton-line"></div>
          </div>
        </div>
        <div class="window-startup-main-progress"></div>
        <div class="window-startup-stage-grid">
          <% for (let index = 0; index < 4; index += 1) { %>
          <div class="window-startup-stage-placeholder">
            <div class="window-startup-stage-placeholder-row">
              <div class="window-startup-stage-placeholder-icon"></div>
              <div class="window-startup-skeleton-line"></div>
            </div>
            <div class="window-startup-stage-placeholder-track"></div>
            <div class="window-startup-stage-placeholder-value"></div>
          </div>
          <% } %>
        </div>
      </div>
      <% } else { %>
      <div id="window-startup-spinner"></div>
      <% } %>
    </div>
    <div id="root"></div>
  </body>
</html>
