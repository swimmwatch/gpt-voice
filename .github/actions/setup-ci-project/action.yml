name: Set up CI project
description: Sets up the configured Node.js runtime and optionally installs the locked project dependencies.
inputs:
  install-dependencies:
    description: Whether to install locked npm dependencies after Node.js setup.
    required: false
    default: 'true'
  node-version:
    description: Node.js version supplied by the calling workflow configuration.
    required: true
  package-manager-cache:
    description: Whether setup-node should restore the package-manager cache.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: ${{ inputs.package-manager-cache }}

    - name: Verify exact lockfile registry signatures before lifecycle scripts
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: node scripts/security/verify-npm-signatures-preinstall.mjs

    - name: Install locked dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: npm run ci:install
