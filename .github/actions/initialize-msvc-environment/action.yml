name: Initialize MSVC developer environment
description: Exposes the hosted Windows x64 C++ toolchain to subsequent workflow steps.
inputs:
  required-compiler-version:
    default: '19.39'
    description: Required MSVC compiler major.minor version.
    required: false
runs:
  using: composite
  steps:
    - shell: pwsh
      env:
        REQUIRED_COMPILER_VERSION: ${{ inputs.required-compiler-version }}
      run: |
        if ($env:REQUIRED_COMPILER_VERSION -notmatch '^19\.39$') { throw 'Only the reviewed MSVC 19.39 profile is supported' }
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        if (!(Test-Path -LiteralPath $vswhere)) { throw 'Visual Studio locator is unavailable' }
        $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if ([string]::IsNullOrWhiteSpace($installationPath)) { throw 'Visual Studio C++ build tools are unavailable' }
        $vcvars = Join-Path $installationPath 'VC\Auxiliary\Build\vcvarsall.bat'
        if (!(Test-Path -LiteralPath $vcvars)) { throw 'Visual Studio x64 developer environment is unavailable' }
        $captured = & cmd.exe /d /c "call `"$vcvars`" x64 && set"
        if ($LASTEXITCODE -ne 0) { throw 'Visual Studio developer environment initialization failed' }
        $required = @('INCLUDE', 'LIB', 'LIBPATH', 'PATH', 'SystemRoot', 'TEMP', 'TMP', 'WINDIR')
        $values = @{}
        foreach ($line in $captured) {
          $separator = $line.IndexOf('=')
          if ($separator -gt 0) { $values[$line.Substring(0, $separator)] = $line.Substring($separator + 1) }
        }
        foreach ($name in $required) {
          if ([string]::IsNullOrWhiteSpace($values[$name])) { throw "Visual Studio developer environment omitted $name" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$($values[$name])" -Encoding utf8
        }
        $env:PATH = $values['PATH']
        $tools = @{
          CMAKE_COMMAND = (Get-Command cmake.exe -ErrorAction Stop).Source
          CTEST_COMMAND = (Get-Command ctest.exe -ErrorAction Stop).Source
          CXX = (Get-Command cl.exe -ErrorAction Stop).Source
          NINJA_COMMAND = (Get-Command ninja.exe -ErrorAction Stop).Source
        }
        $compilerVersion = (& $tools.CXX /Bv 2>&1 | Out-String)
        if ($compilerVersion -notmatch "Version $([regex]::Escape($env:REQUIRED_COMPILER_VERSION))\.") {
          throw "Hosted compiler does not match MSVC $env:REQUIRED_COMPILER_VERSION"
        }
        foreach ($name in $tools.Keys) {
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$($tools[$name])" -Encoding utf8
        }
