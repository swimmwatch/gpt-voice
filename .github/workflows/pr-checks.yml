name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - .gitattributes
      - .github/actions/**
      - .github/codeql-config.yml
      - .github/workflows/**
      - .prettierignore
      - .prettierrc
      - build/**
      - build/fedora-release/**
      - docs/specs/local-whisper-native-review-remediation/**
      - docs/specs/local-whisper-performance-remediation/**
      - eslint.config.mjs
      - package-lock.json
      - package.json
      - postcss.config.js
      - runtime/local-whisper/**
      - scripts/**
      - src/main/**
      - src/renderer/**
      - src/shared/**
      - tests/**
      - tsconfig*.json
      - webpack.config.js
  push:
    branches:
      - main
    paths:
      - .gitattributes
      - .github/actions/**
      - .github/codeql-config.yml
      - .github/workflows/**
      - .prettierignore
      - .prettierrc
      - build/**
      - build/fedora-release/**
      - docs/specs/local-whisper-native-review-remediation/**
      - docs/specs/local-whisper-performance-remediation/**
      - eslint.config.mjs
      - package-lock.json
      - package.json
      - postcss.config.js
      - runtime/local-whisper/**
      - scripts/**
      - src/main/**
      - src/renderer/**
      - src/shared/**
      - tests/**
      - tsconfig*.json
      - webpack.config.js
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  CLOAKBROWSER_AUTO_UPDATE: 'false'
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm

jobs:
  native-linux-core:
    name: Local Whisper Linux / Core and CodeQL
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    env:
      EVIDENCE_ARTIFACT: local-whisper-runner-evidence-linux-primary
      EVIDENCE_OUTPUT: release-artifacts/local-whisper-runner-evidence-linux-primary.json
      PLATFORM: linux
      TOOLCHAIN: clang-${{ vars.CI_LLVM_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up project
        uses: ./.github/actions/setup-ci-project
        with:
          node-version: ${{ vars.CI_NODE_VERSION }}
      - name: Install and configure Linux native toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build gcc-${{ vars.CI_GCC_VERSION }} g++-${{ vars.CI_GCC_VERSION }} clang-${{ vars.CI_LLVM_VERSION }} clang-format-${{ vars.CI_LLVM_VERSION }} clang-tidy-${{ vars.CI_LLVM_VERSION }} libclang-rt-${{ vars.CI_LLVM_VERSION }}-dev lld-${{ vars.CI_LLVM_VERSION }}
          {
            echo "CMAKE_COMMAND=$(command -v cmake)"
            echo "CTEST_COMMAND=$(command -v ctest)"
            echo "CXX=$(command -v clang++-${{ vars.CI_LLVM_VERSION }})"
            echo "CLANG_FORMAT=$(command -v clang-format-${{ vars.CI_LLVM_VERSION }})"
            echo "CLANG_TIDY=$(command -v clang-tidy-${{ vars.CI_LLVM_VERSION }})"
            echo "NINJA_COMMAND=$(command -v ninja)"
            echo "LOCAL_WHISPER_GCC_C_COMPILER=$(command -v x86_64-linux-gnu-gcc-${{ vars.CI_GCC_VERSION }})"
            echo "LOCAL_WHISPER_GCC_CXX_COMPILER=$(command -v x86_64-linux-gnu-g++-${{ vars.CI_GCC_VERSION }})"
            echo "LOCAL_WHISPER_GCC_LINKER=$(command -v x86_64-linux-gnu-ld.bfd)"
            echo "LOCAL_WHISPER_CLANG_C_COMPILER=$(command -v clang-${{ vars.CI_LLVM_VERSION }})"
            echo "LOCAL_WHISPER_CLANG_CXX_COMPILER=$(command -v clang++-${{ vars.CI_LLVM_VERSION }})"
            echo "LOCAL_WHISPER_CLANG_LINKER=$(command -v ld.lld-${{ vars.CI_LLVM_VERSION }})"
            echo "LOCAL_WHISPER_PREPARED_LINUX_QUALITY=true"
          } >> "$GITHUB_ENV"
      - name: Provision verified Local Whisper native test sources
        run: npm run prepare:local-whisper:native-test-sources
      - name: Verify Local Whisper native source objects
        run: |
          npm run verify:local-whisper:native-source -- --lock=nlohmann-json-v3.12.0-subset
          npm run verify:local-whisper:native-source -- --lock=googletest-v1.17.0-52eb810
          npm run verify:local-whisper:native-source -- --lock=whisper-cpp-v1.9.1-f049fff
      - name: Initialize Linux C++ CodeQL database
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          build-mode: manual
          db-location: ${{ github.workspace }}/.cache/codeql/cpp-linux
          languages: c-cpp
          queries: security-and-quality
      - name: Prove non-recovering Linux sanitizer policy
        env:
          LD_PRELOAD: ''
        run: npm run test:local-whisper:native-sanitizer-proof -- --mode=prepared-linux-quality
      - name: Run Linux worker ThreadSanitizer gate
        run: |
          npm run test:local-whisper:worker-tsan-proof
          npm run test:local-whisper:worker-tsan
      - name: Run bounded Linux parser fuzzing
        run: |
          npm run test:local-whisper:native-fuzz
          npm run test:local-whisper:native-fuzz-proof
      - name: Run Linux worker and sanitizer suites
        run: |
          npm run test:local-whisper:worker-codec
          npm run test:local-whisper:worker-proof-vectors
          npm run test:local-whisper:worker-authority
          npm run test:local-whisper:fs-guard:native
          npm run test:local-whisper:launcher:native
          npm run verify:local-whisper:worker-authority -- --platform=linux
          npm run verify:local-whisper:loader-limits -- --table=whisper-cpp-loader-limits-v1
          npm run test:local-whisper:whisper-cpp-core
          npm run test:local-whisper:whisper-cpp-loader
          npm run test:local-whisper:whisper-cpp-device-proof
          npm run test:local-whisper:whisper-cpp-cancellation
      - name: Run Linux compatibility checks
        run: |
          npm run test:local-whisper:supervisor
          npm run test:local-whisper:filesystem
          npm run verify:local-whisper:filesystem -- --fixture
      - name: Analyze Linux C++ CodeQL database
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:c-cpp,host:linux
          output: release-artifacts/codeql-cpp-linux
          upload: always
      - name: Emit Linux native-quality coverage
        shell: bash
        run: >-
          npm run emit:local-whisper:native-quality-coverage -- --platform=$PLATFORM --compiler-profile=$TOOLCHAIN --evidence=contract-inspection,compile,execute,analyze,sanitize,tsan,binary-inspection --codeql-database=.cache/codeql/cpp-linux/cpp --output=release-artifacts/native-quality-coverage-linux.json
      - name: Emit Linux runner evidence
        shell: bash
        run: npm run emit:local-whisper:runner-evidence -- --runner-label=${{ vars.CI_LINUX_RUNNER }} --toolchain=$TOOLCHAIN --expected-os=$PLATFORM --compiler="$CXX" --output=$EVIDENCE_OUTPUT --tested-digests=52eb8108c5bdec04579160ae17225d66034bd723,55f93686c01528224f448c19128836e7df245f72,f049fff95a089aa9969deb009cdd4892b3e74916
      - name: Upload Linux runner evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: |
            ${{ env.EVIDENCE_OUTPUT }}
            release-artifacts/native-quality-coverage-linux.json
          if-no-files-found: error
          retention-days: ${{ vars.CI_EVIDENCE_RETENTION_DAYS }}

  native-linux-shards:
    name: Local Whisper Linux / ${{ matrix.checkName }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - checkName: Static Analysis
            lane: static-analysis
            runner: ${{ vars.CI_LINUX_RUNNER }}
            timeoutMinutes: 20
          - checkName: GCC and Package
            lane: gcc-package
            runner: ${{ vars.CI_LINUX_RUNNER }}
            timeoutMinutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up project
        uses: ./.github/actions/setup-ci-project
        with:
          node-version: ${{ vars.CI_NODE_VERSION }}
      - name: Install and configure Linux native toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build gcc-${{ vars.CI_GCC_VERSION }} g++-${{ vars.CI_GCC_VERSION }} clang-${{ vars.CI_LLVM_VERSION }} clang-format-${{ vars.CI_LLVM_VERSION }} clang-tidy-${{ vars.CI_LLVM_VERSION }} libclang-rt-${{ vars.CI_LLVM_VERSION }}-dev lld-${{ vars.CI_LLVM_VERSION }}
          {
            echo "CMAKE_COMMAND=$(command -v cmake)"
            echo "CTEST_COMMAND=$(command -v ctest)"
            echo "CXX=$(command -v clang++-${{ vars.CI_LLVM_VERSION }})"
            echo "CLANG_FORMAT=$(command -v clang-format-${{ vars.CI_LLVM_VERSION }})"
            echo "CLANG_TIDY=$(command -v clang-tidy-${{ vars.CI_LLVM_VERSION }})"
            echo "NINJA_COMMAND=$(command -v ninja)"
            echo "LOCAL_WHISPER_GCC_C_COMPILER=$(command -v x86_64-linux-gnu-gcc-${{ vars.CI_GCC_VERSION }})"
            echo "LOCAL_WHISPER_GCC_CXX_COMPILER=$(command -v x86_64-linux-gnu-g++-${{ vars.CI_GCC_VERSION }})"
            echo "LOCAL_WHISPER_GCC_LINKER=$(command -v x86_64-linux-gnu-ld.bfd)"
            echo "LOCAL_WHISPER_CLANG_C_COMPILER=$(command -v clang-${{ vars.CI_LLVM_VERSION }})"
            echo "LOCAL_WHISPER_CLANG_CXX_COMPILER=$(command -v clang++-${{ vars.CI_LLVM_VERSION }})"
            echo "LOCAL_WHISPER_CLANG_LINKER=$(command -v ld.lld-${{ vars.CI_LLVM_VERSION }})"
            echo "LOCAL_WHISPER_PREPARED_LINUX_QUALITY=true"
          } >> "$GITHUB_ENV"
      - name: Provision verified Local Whisper native test sources
        run: npm run prepare:local-whisper:native-test-sources
      - name: Run Linux formatting and clang-tidy checks
        if: matrix.lane == 'static-analysis'
        run: |
          npm run verify:local-whisper:worker-vectors -- --check-clean
          npm run format:check:local-whisper:worker-common
          npm run format:check:local-whisper:fs-guard
          npm run format:check:local-whisper:launcher
          npm run lint:local-whisper:fs-guard
          npm run lint:local-whisper:launcher
          npm run lint:local-whisper:worker-common
      - name: Prove Linux analyzer rejects bad sources
        if: matrix.lane == 'static-analysis'
        run: npm run test:local-whisper:native-analysis
      - name: Run focused Linux GCC 13 guard and launcher quality
        if: matrix.lane == 'gcc-package'
        run: |
          npm run test:local-whisper:fs-guard:gcc
          npm run test:local-whisper:launcher:gcc
          npm run emit:local-whisper:focused-gcc-quality-coverage -- --output=release-artifacts/focused-gcc-quality-coverage-linux.json
      - name: Build and verify Linux Whisper.cpp CPU pack
        if: matrix.lane == 'gcc-package'
        run: |
          npm run build:local-whisper:fs-guard
          npm run build:local-whisper:launcher
          npm run build:local-whisper:whisper-cpp-cpu -- --profile=linux-x64-cpu-baseline-v1
          npm run verify:local-whisper:native-hardening -- --platform=linux
          npm run verify:local-whisper:whisper-cpp-cpu -- --profile=linux-x64-cpu-baseline-v1
          npm run audit:local-whisper:whisper-cpp-pack -- --profile=linux-x64-cpu-baseline-v1
      - name: Verify Linux AMD contracts without hardware claims
        if: matrix.lane == 'gcc-package'
        run: |
          npm run format:check:local-whisper:amd-packs
          npm run lint:local-whisper:amd-packs
          npm run test:local-whisper:amd-packs
          npm run verify:local-whisper:amd-packs -- --profile=vulkan-contract-linux
          npm run verify:local-whisper:amd-packs -- --profile=hip-no-approved-row
      - name: Upload focused GCC coverage
        if: matrix.lane == 'gcc-package'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-whisper-focused-gcc-quality-coverage-linux
          path: release-artifacts/focused-gcc-quality-coverage-linux.json
          if-no-files-found: error
          retention-days: ${{ vars.CI_EVIDENCE_RETENTION_DAYS }}

  native-quality-linux:
    name: Local Whisper Native Quality (Linux)
    if: ${{ always() }}
    needs:
      - native-linux-core
      - native-linux-shards
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 5
    env:
      CORE_RESULT: ${{ needs.native-linux-core.result }}
      SHARDS_RESULT: ${{ needs.native-linux-shards.result }}
    steps:
      - name: Require every Linux native lane
        shell: bash
        run: |
          if [[ "$CORE_RESULT" != 'success' || "$SHARDS_RESULT" != 'success' ]]; then
            echo "Linux native lanes did not all succeed" >&2
            exit 1
          fi

  native-windows-core:
    name: Local Whisper Windows / Core and CodeQL
    runs-on: ${{ vars.CI_WINDOWS_RUNNER }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    env:
      EVIDENCE_ARTIFACT: local-whisper-runner-evidence-windows-primary
      EVIDENCE_OUTPUT: release-artifacts/local-whisper-runner-evidence-windows-primary.json
      PLATFORM: windows
      TOOLCHAIN: windows-x64-msvc-19.51-v1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up project
        uses: ./.github/actions/setup-ci-project
        with:
          node-version: ${{ vars.CI_NODE_VERSION }}
      - name: Provision verified Local Whisper native test sources
        run: npm run prepare:local-whisper:native-test-sources
      - name: Initialize MSVC developer environment
        uses: ./.github/actions/initialize-msvc-environment
      - name: Mark Windows native environment prepared
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value 'LOCAL_WHISPER_PREPARED_WINDOWS_QUALITY=true' -Encoding utf8
      - name: Initialize Windows C++ CodeQL database
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          build-mode: manual
          db-location: ${{ github.workspace }}/.cache/codeql/cpp-windows
          languages: c-cpp
          queries: security-and-quality
      - name: Run MSVC native and worker suites
        run: |
          npm run test:local-whisper:fs-guard:native
          npm run test:local-whisper:launcher:native
          npm run test:local-whisper:worker-codec
          npm run test:local-whisper:whisper-cpp-core
      - name: Build and verify hardened Windows production binaries
        run: |
          npm run build:local-whisper:fs-guard
          npm run build:local-whisper:launcher
          npm run build:local-whisper:whisper-cpp-cpu -- --profile=windows-x64-cpu-msvc-19.51-v1 --skip-runtime-pack
          npm run verify:local-whisper:native-hardening -- --platform=windows
          npm run verify:local-whisper:whisper-cpp-cuda -- --profile=windows-x64-cuda-12.8.1-sm120a-msvc-19.39-v1 --contract-only
          npm run verify:local-whisper:amd-packs -- --profile=vulkan-windows-x64
      - name: Run Windows compatibility checks
        run: |
          npm run test:local-whisper:supervisor
          npm run test:local-whisper:filesystem
      - name: Analyze Windows C++ CodeQL database
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:c-cpp,host:windows
          output: release-artifacts/codeql-cpp-windows
          upload: always
      - name: Emit Windows native-quality coverage
        shell: pwsh
        run: >-
          npm run emit:local-whisper:native-quality-coverage -- --platform=$env:PLATFORM --compiler-profile=$env:TOOLCHAIN --evidence=contract-inspection,compile,execute,analyze,sanitize,binary-inspection --codeql-database=.cache/codeql/cpp-windows/cpp --output=release-artifacts/native-quality-coverage-windows.json
      - name: Emit Windows runner evidence
        shell: pwsh
        run: npm run emit:local-whisper:runner-evidence -- --runner-label=${{ vars.CI_WINDOWS_RUNNER }} --toolchain=$env:TOOLCHAIN --expected-os=$env:PLATFORM --compiler="$env:CXX" --output=$env:EVIDENCE_OUTPUT --tested-digests=52eb8108c5bdec04579160ae17225d66034bd723,55f93686c01528224f448c19128836e7df245f72,f049fff95a089aa9969deb009cdd4892b3e74916
      - name: Upload Windows runner evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: |
            ${{ env.EVIDENCE_OUTPUT }}
            release-artifacts/native-quality-coverage-windows.json
          if-no-files-found: error
          retention-days: ${{ vars.CI_EVIDENCE_RETENTION_DAYS }}

  native-windows-shards:
    name: Local Whisper Windows / ${{ matrix.checkName }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - checkName: MSVC Analyze
            lane: analyze
            runner: ${{ vars.CI_WINDOWS_RUNNER }}
            timeoutMinutes: 30
          - checkName: MSVC AddressSanitizer
            lane: asan
            runner: ${{ vars.CI_WINDOWS_RUNNER }}
            timeoutMinutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up project
        uses: ./.github/actions/setup-ci-project
        with:
          node-version: ${{ vars.CI_NODE_VERSION }}
      - name: Provision verified Local Whisper native test sources
        run: npm run prepare:local-whisper:native-test-sources
      - name: Initialize MSVC developer environment
        uses: ./.github/actions/initialize-msvc-environment
      - name: Mark Windows native environment prepared
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value 'LOCAL_WHISPER_PREPARED_WINDOWS_QUALITY=true' -Encoding utf8
      - name: Run MSVC /analyze native suites
        if: matrix.lane == 'analyze'
        env:
          LOCAL_WHISPER_MSVC_ANALYZE: 'true'
        run: |
          npm run test:local-whisper:fs-guard:native
          npm run test:local-whisper:launcher:native
          npm run test:local-whisper:worker-codec
          npm run test:local-whisper:whisper-cpp-core
          npm run build:local-whisper:whisper-cpp-cpu -- --profile=windows-x64-cpu-msvc-19.51-v1 --skip-runtime-pack
      - name: Run MSVC AddressSanitizer native suites
        if: matrix.lane == 'asan'
        run: |
          npm run test:local-whisper:fs-guard:msvc-asan
          npm run test:local-whisper:launcher:msvc-asan
          npm run test:local-whisper:worker-codec:msvc-asan
          npm run test:local-whisper:whisper-cpp:msvc-asan
          npm run verify:local-whisper:worker-authority -- --platform=windows --contract-only
          npm run verify:local-whisper:whisper-cpp-cpu -- --profile=windows-x64-cpu-msvc-19.51-v1 --contract-only

  native-quality-windows:
    name: Local Whisper Native Quality (Windows)
    if: ${{ always() }}
    needs:
      - native-windows-core
      - native-windows-shards
    runs-on: ${{ vars.CI_WINDOWS_RUNNER }}
    timeout-minutes: 5
    env:
      CORE_RESULT: ${{ needs.native-windows-core.result }}
      SHARDS_RESULT: ${{ needs.native-windows-shards.result }}
    steps:
      - name: Require every Windows native lane
        shell: pwsh
        run: |
          if ($env:CORE_RESULT -ne 'success' -or $env:SHARDS_RESULT -ne 'success') {
            throw 'Windows native lanes did not all succeed'
          }

  performance-linux-fixtures:
    name: Local Whisper Performance Linux / Contract Fixtures
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up project
        uses: ./.github/actions/setup-ci-project
        with:
          node-version: ${{ vars.CI_NODE_VERSION }}
          package-manager-cache: 'true'
      - name: Prove performance qualification contracts
        run: npm run test:local-whisper:performance-contracts
      - name: Verify deterministic Linux performance fixtures
        run: npm run verify:local-whisper:performance:linux

  performance-linux:
    name: Local Whisper Performance (Linux)
    if: ${{ always() }}
    needs:
      - performance-linux-fixtures
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 5
    env:
      FIXTURE_RESULT: ${{ needs.performance-linux-fixtures.result }}
    steps:
      - name: Require every Linux performance lane
        shell: bash
        run: |
          if [[ "$FIXTURE_RESULT" != 'success' ]]; then
            echo "Linux performance lanes did not all pass" >&2
            exit 1
          fi

  performance-windows-fixtures:
    name: Local Whisper Performance Windows / Contract Fixtures
    runs-on: ${{ vars.CI_WINDOWS_RUNNER }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up project
        uses: ./.github/actions/setup-ci-project
        with:
          node-version: ${{ vars.CI_NODE_VERSION }}
          package-manager-cache: 'true'
      - name: Prove performance qualification contracts
        run: npm run test:local-whisper:performance-contracts
      - name: Verify deterministic Windows CPU and CUDA-contract fixtures
        run: npm run verify:local-whisper:qualification:windows

  performance-windows:
    name: Local Whisper Performance (Windows)
    if: ${{ always() }}
    needs:
      - performance-windows-fixtures
    runs-on: ${{ vars.CI_WINDOWS_RUNNER }}
    timeout-minutes: 5
    env:
      FIXTURE_RESULT: ${{ needs.performance-windows-fixtures.result }}
    steps:
      - name: Require every Windows performance lane
        shell: pwsh
        run: |
          if ($env:FIXTURE_RESULT -ne 'success') {
            throw 'Windows performance lanes did not all pass'
          }

  quality-static:
    name: Quality / Static and Type Contracts
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: ${{ fromJSON(vars.CI_QUALITY_TIMEOUT_MINUTES) }}
    env:
      CI_LINUX_RUNNER: ${{ vars.CI_LINUX_RUNNER }}
      CI_WINDOWS_RUNNER: ${{ vars.CI_WINDOWS_RUNNER }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up project
        uses: ./.github/actions/setup-ci-project
        with:
          node-version: ${{ vars.CI_NODE_VERSION }}
          package-manager-cache: 'true'
      - name: Check formatting
        run: npm run format:check
      - name: Validate Dependabot configuration
        run: npm run validate:dependabot
      - name: Generate package metadata
        run: npm run generate:package-metadata -- --release-date=${{ vars.CI_FIXTURE_RELEASE_DATE }}
      - name: Lint
        run: npm run lint
      - name: Typecheck source, tests, and scripts
        run: npm run test:types
      - name: Prove CodeQL policy and source inclusion contracts
        run: npm run test:security:codeql-policy
      - name: Prove security evidence and aggregate gate policies
        run: |
          npm run test:security:attestation-policy
          npm run test:security:evidence-policy
          npm run test:security:aggregate-gates
          npm run test:security:scorecard-policy

  quality-tests:
    name: Quality / Tests and Production Build
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: ${{ fromJSON(vars.CI_QUALITY_TIMEOUT_MINUTES) }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up project
        uses: ./.github/actions/setup-ci-project
        with:
          node-version: ${{ vars.CI_NODE_VERSION }}
          package-manager-cache: 'true'
      - name: Cache Electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.NPM_CONFIG_CACHE }}
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - name: Cache Node test compile output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.cache/node-compile-cache
          key: ${{ runner.os }}-node-compile-${{ vars.CI_NODE_VERSION }}-${{ hashFiles('package-lock.json', 'package.json', 'tsconfig*.json', 'webpack.config.js', 'scripts/**/*.mjs', 'scripts/**/*.ts', 'src/**/*.ts', 'src/**/*.tsx', 'tests/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-node-compile-${{ vars.CI_NODE_VERSION }}-
      - name: Generate package metadata
        run: npm run generate:package-metadata -- --release-date=${{ vars.CI_FIXTURE_RELEASE_DATE }}
      - name: Unit tests
        run: npm run test:unit:ci
        env:
          NODE_COMPILE_CACHE: ${{ github.workspace }}/.cache/node-compile-cache
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Build production bundles
        run: npm run build:prod
      - name: Verify production renderer bundles
        run: npm run verify:renderer-bundle

  quality-codeql:
    name: Quality / JavaScript and TypeScript CodeQL
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: ${{ fromJSON(vars.CI_QUALITY_TIMEOUT_MINUTES) }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize JavaScript and TypeScript CodeQL database
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          build-mode: none
          config-file: ./.github/codeql-config.yml
          db-location: ${{ github.workspace }}/.cache/codeql/javascript-typescript
          languages: javascript-typescript
          queries: security-and-quality
      - name: Analyze JavaScript and TypeScript CodeQL database
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:javascript-typescript
          output: release-artifacts/codeql-javascript-typescript
          upload: always

  quality:
    name: Quality Gates
    if: ${{ always() }}
    needs:
      - quality-static
      - quality-tests
      - quality-codeql
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 5
    env:
      CODEQL_RESULT: ${{ needs.quality-codeql.result }}
      STATIC_RESULT: ${{ needs.quality-static.result }}
      TESTS_RESULT: ${{ needs.quality-tests.result }}
    steps:
      - name: Require every quality lane
        shell: bash
        run: |
          if [[ "$STATIC_RESULT" != 'success' || "$TESTS_RESULT" != 'success' || "$CODEQL_RESULT" != 'success' ]]; then
            echo "Quality lanes did not all succeed" >&2
            exit 1
          fi

  package-smoke:
    name: Package Smoke (${{ matrix.checkName }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - checkName: Fedora Linux
            artifactPlatform: linux
            platform: linux
            runner: ${{ vars.CI_LINUX_RUNNER }}
            timeoutMinutes: 60
          - checkName: Windows
            artifactPlatform: win32
            platform: windows
            runner: ${{ vars.CI_WINDOWS_RUNNER }}
            timeoutMinutes: 45
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      FEDORA_RELEASE_IMAGE: ${{ vars.CI_FEDORA_RELEASE_IMAGE }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-ci-project
        with:
          install-dependencies: 'true'
          node-version: ${{ vars.CI_NODE_VERSION }}

      - name: Set up Docker Buildx
        if: matrix.platform == 'linux'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Fedora release image
        if: matrix.platform == 'linux'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: build/fedora-release
          file: build/fedora-release/Dockerfile
          load: true
          tags: ${{ env.FEDORA_RELEASE_IMAGE }}

      - name: Build and smoke exact Linux packages in Fedora
        if: matrix.platform == 'linux'
        run: node scripts/build-fedora-release.mjs --skip-image-build --image=${{ env.FEDORA_RELEASE_IMAGE }} --mode=release --release-date=${{ vars.CI_FIXTURE_RELEASE_DATE }}

      - name: Initialize MSVC developer environment
        if: matrix.platform == 'windows'
        uses: ./.github/actions/initialize-msvc-environment

      - name: Build and smoke Windows package
        if: matrix.platform == 'windows'
        run: |
          npm run prepare:cloakbrowser -- --target=win32
          npm run smoke:cloakbrowser
          npm run build:prod
          npm run generate:package-metadata -- --release-date=${{ vars.CI_FIXTURE_RELEASE_DATE }}
          npm run prepare:local-whisper:packaging -- --mode=disabled --platform=win32
          npx electron-builder --win --publish never
          npm run verify:packaged
          npm run verify:installers -- --platform=win32
          npm run measure:size -- --platform=win32 --arch=${{ vars.CI_ARCHITECTURE }} --output=release-artifacts/size-win32-x64.json
          npm run measure:startup -- --runs=10 --output=release-artifacts/startup-win32-x64.json

      - name: Set up immutable artifact vulnerability scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          path: ${{ runner.temp }}/trivy
          version: v0.69.3

      - name: Generate and scan exact application security evidence
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/gpt-voice-trivy
        run: >-
          npm run scan:security:application-artifacts --
          --platform=${{ matrix.artifactPlatform }}
          --source-commit=${{ github.sha }}
          --output-directory=release-artifacts/application-security-${{ matrix.artifactPlatform }}

      - name: Prepare digest-bound attestation subjects
        run: >-
          npm run prepare:security:package-attestation --
          --platform=${{ matrix.artifactPlatform }}
          --source-commit=${{ github.sha }}
          --repository=${{ github.repository }}
          --invocation=${{ github.run_id }}-${{ github.run_attempt }}-package-smoke-${{ matrix.artifactPlatform }}
          --output-directory=release-artifacts/attestation-subjects-${{ matrix.artifactPlatform }}

      - name: Verify Windows size budget when a reviewed baseline exists
        if: matrix.platform == 'windows' && hashFiles('build/size-baselines/v1.4.0-win32-x64.json') != ''
        run: npm run verify:size -- --report=release-artifacts/size-win32-x64.json --baseline=build/size-baselines/v1.4.0-win32-x64.json

      - name: Upload Linux measurement reports
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpt-voice-linux-measurements
          path: |
            release-artifacts/size-linux-x64.json
            release-artifacts/startup-linux-x64.json
          if-no-files-found: error
          retention-days: ${{ vars.CI_EVIDENCE_RETENTION_DAYS }}

      - name: Upload Windows measurement reports
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpt-voice-windows-measurements
          path: |
            release-artifacts/size-win32-x64.json
            release-artifacts/startup-win32-x64.json
          if-no-files-found: error
          retention-days: ${{ vars.CI_EVIDENCE_RETENTION_DAYS }}

      - name: Upload bounded application security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpt-voice-application-security-${{ matrix.artifactPlatform }}
          path: release-artifacts/application-security-${{ matrix.artifactPlatform }}
          if-no-files-found: error
          retention-days: ${{ vars.CI_EVIDENCE_RETENTION_DAYS }}

      - name: Upload exact attestation subjects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpt-voice-attestation-subjects-${{ matrix.artifactPlatform }}
          path: release-artifacts/attestation-subjects-${{ matrix.artifactPlatform }}
          if-no-files-found: error
          retention-days: ${{ vars.CI_EVIDENCE_RETENTION_DAYS }}

  package-attestation-input:
    name: Package Attestation Input (${{ matrix.checkName }})
    needs: package-smoke
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifactPlatform: linux
            checkName: Fedora Linux
          - artifactPlatform: win32
            checkName: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-ci-project
        with:
          node-version: ${{ vars.CI_NODE_VERSION }}

      - name: Download exact attestation subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gpt-voice-attestation-subjects-${{ matrix.artifactPlatform }}
          path: attestation-subjects

      - name: Verify signed-input candidate and subject bindings
        run: >-
          npm run verify:security:package-attestation --
          --input=attestation-subjects/attestation-input.json
          --platform=${{ matrix.artifactPlatform }}
          --source-commit=${{ github.sha }}
          --repository=${{ github.repository }}
          --invocation=${{ github.run_id }}-${{ github.run_attempt }}-package-smoke-${{ matrix.artifactPlatform }}

  package-attestation:
    name: Package Attestation (${{ matrix.checkName }})
    needs: package-attestation-input
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifactPlatform: linux
            checkName: Fedora Linux
            platform: linux
          - artifactPlatform: win32
            checkName: Windows
            platform: windows

    steps:
      - name: Download exact attestation subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gpt-voice-attestation-subjects-${{ matrix.artifactPlatform }}
          path: attestation-subjects

      - name: Attest exact package chain
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            attestation-subjects/attestation-input.json
            attestation-subjects/subject/package
            attestation-subjects/subject/checksum
            attestation-subjects/subject/sbom
            attestation-subjects/subject/scanner
            attestation-subjects/subject/smoke

      - name: Verify GitHub-native attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_DIGEST: ${{ github.sha }}
        run: |
          while IFS= read -r subject; do
            gh attestation verify "$subject" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/pr-checks.yml" \
              --source-digest "$SOURCE_DIGEST" \
              --predicate-type https://slsa.dev/provenance/v1 >/dev/null
          done <<'SUBJECTS'
          attestation-subjects/attestation-input.json
          attestation-subjects/subject/package
          attestation-subjects/subject/checksum
          attestation-subjects/subject/sbom
          attestation-subjects/subject/scanner
          attestation-subjects/subject/smoke
          SUBJECTS

  security-aggregate:
    name: Security and Supply-Chain Gates
    if: ${{ always() }}
    needs:
      - native-quality-linux
      - native-quality-windows
      - quality
      - package-attestation
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      LINUX_NATIVE_RESULT: ${{ needs.native-quality-linux.result }}
      WINDOWS_NATIVE_RESULT: ${{ needs.native-quality-windows.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      PACKAGE_ATTESTATION_RESULT: ${{ needs.package-attestation.result }}
    steps:
      - name: Require every blocking security lane
        shell: bash
        run: |
          if [[ "$LINUX_NATIVE_RESULT" != 'success' || "$WINDOWS_NATIVE_RESULT" != 'success' || "$QUALITY_RESULT" != 'success' || "$PACKAGE_ATTESTATION_RESULT" != 'success' ]]; then
            echo "Blocking security lanes did not all succeed" >&2
            exit 1
          fi
