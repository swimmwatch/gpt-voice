name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/actions/initialize-msvc-environment/action.yml
      - .github/workflows/**
      - build/fedora-release/**
      - package-lock.json
      - package.json
      - runtime/local-whisper/**
      - scripts/build-fedora-release.mjs
      - scripts/local-whisper/**
      - scripts/prepare-cloakbrowser.mjs
      - src/main/localWhisper/**
      - src/shared/localWhisper/**
      - webpack.config.js
  push:
    branches:
      - main
    paths:
      - .github/actions/initialize-msvc-environment/action.yml
      - .github/workflows/**
      - build/fedora-release/**
      - package-lock.json
      - package.json
      - runtime/local-whisper/**
      - scripts/build-fedora-release.mjs
      - scripts/local-whisper/**
      - scripts/prepare-cloakbrowser.mjs
      - src/main/localWhisper/**
      - src/shared/localWhisper/**
      - webpack.config.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  CLOAKBROWSER_AUTO_UPDATE: 'false'

jobs:
  native-quality-linux:
    name: Local Whisper Native Quality (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CXX: clang++-18
      CLANG_FORMAT: clang-format-18
      CLANG_TIDY: clang-tidy-18
      CMAKE_COMMAND: /usr/bin/cmake
      CTEST_COMMAND: /usr/bin/ctest
      LOCAL_WHISPER_PREPARED_LINUX_QUALITY: 'true'
      NINJA_COMMAND: /usr/bin/ninja
      LOCAL_WHISPER_GCC_C_COMPILER: /usr/bin/x86_64-linux-gnu-gcc-13
      LOCAL_WHISPER_GCC_CXX_COMPILER: /usr/bin/x86_64-linux-gnu-g++-13
      LOCAL_WHISPER_GCC_LINKER: /usr/bin/x86_64-linux-gnu-ld.bfd
      LOCAL_WHISPER_CLANG_C_COMPILER: /usr/bin/clang-18
      LOCAL_WHISPER_CLANG_CXX_COMPILER: /usr/bin/clang++-18
      LOCAL_WHISPER_CLANG_LINKER: /usr/bin/ld.lld-18
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build gcc-13 g++-13 clang-18 clang-format-18 clang-tidy-18 lld-18

      - name: Install dependencies
        run: npm run ci:install

      - name: Provision verified Local Whisper native test sources
        run: npm run prepare:local-whisper:native-test-sources

      - name: Verify Local Whisper native source objects
        run: |
          npm run verify:local-whisper:native-source -- --lock=nlohmann-json-v3.12.0-subset
          npm run verify:local-whisper:native-source -- --lock=googletest-v1.17.0-52eb810
          npm run verify:local-whisper:native-source -- --lock=whisper-cpp-v1.9.1-f049fff

      - name: Prove non-recovering Linux sanitizer policy
        run: npm run test:local-whisper:native-sanitizer-proof -- --mode=prepared-linux-quality

      - name: Verify Local Whisper worker vectors
        run: npm run verify:local-whisper:worker-vectors -- --check-clean

      - name: Check worker common formatting
        run: npm run format:check:local-whisper:worker-common

      - name: Check native formatting
        run: npm run format:check:local-whisper:fs-guard

      - name: Check launcher formatting
        run: npm run format:check:local-whisper:launcher

      - name: Run clang-tidy
        run: npm run lint:local-whisper:fs-guard

      - name: Run launcher clang-tidy
        run: npm run lint:local-whisper:launcher

      - name: Run worker common clang-tidy
        run: npm run lint:local-whisper:worker-common

      - name: Run worker codec, proof, and authority suites
        run: |
          npm run test:local-whisper:worker-codec
          npm run test:local-whisper:worker-proof-vectors
          npm run test:local-whisper:worker-authority

      - name: Run sanitized native unit and integration tests
        run: npm run test:local-whisper:fs-guard:native

      - name: Run sanitized launcher unit and process-tree integration tests
        run: npm run test:local-whisper:launcher:native

      - name: Run Local Whisper supervisor conformance tests
        run: npm run test:local-whisper:supervisor

      - name: Verify Linux model-authority handoff
        run: npm run verify:local-whisper:worker-authority -- --platform=linux

      - name: Verify hardened Whisper.cpp loader limits
        run: npm run verify:local-whisper:loader-limits -- --table=whisper-cpp-loader-limits-v1

      - name: Run hardened Whisper.cpp core and loader suites
        run: |
          npm run test:local-whisper:whisper-cpp-core
          npm run test:local-whisper:whisper-cpp-loader
          npm run test:local-whisper:whisper-cpp-device-proof
          npm run test:local-whisper:whisper-cpp-cancellation

      - name: Build and verify Linux Whisper.cpp CPU pack
        run: |
          npm run build:local-whisper:fs-guard
          npm run build:local-whisper:launcher
          npm run build:local-whisper:whisper-cpp-cpu -- --profile=linux-x64-cpu-baseline-v1
          npm run verify:local-whisper:native-hardening -- --platform=linux
          npm run verify:local-whisper:whisper-cpp-cpu -- --profile=linux-x64-cpu-baseline-v1
          npm run audit:local-whisper:whisper-cpp-pack -- --profile=linux-x64-cpu-baseline-v1

      - name: Verify AMD Preview contracts without hardware claims
        run: |
          npm run format:check:local-whisper:amd-packs
          npm run lint:local-whisper:amd-packs
          npm run test:local-whisper:amd-packs
          npm run verify:local-whisper:amd-packs -- --profile=vulkan-contract-linux
          npm run verify:local-whisper:amd-packs -- --profile=hip-no-approved-row

      - name: Run Node/native filesystem compatibility tests
        run: npm run test:local-whisper:filesystem

      - name: Verify Linux filesystem fixture
        run: npm run verify:local-whisper:filesystem -- --fixture

      - name: Emit primary Linux runner evidence
        run: npm run emit:local-whisper:runner-evidence -- --runner-label=ubuntu-24.04 --toolchain=clang-18 --compiler="$CXX" --output=release-artifacts/local-whisper-runner-evidence-linux-primary.json --tested-digests=52eb8108c5bdec04579160ae17225d66034bd723,55f93686c01528224f448c19128836e7df245f72,f049fff95a089aa9969deb009cdd4892b3e74916

      - name: Upload primary Linux runner evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-whisper-runner-evidence-linux-primary
          path: release-artifacts/local-whisper-runner-evidence-linux-primary.json
          if-no-files-found: error
          retention-days: 14

  native-quality-windows:
    name: Local Whisper Native Quality (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      LOCAL_WHISPER_PREPARED_WINDOWS_QUALITY: 'true'
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout locked GoogleTest source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: google/googletest
          ref: 52eb8108c5bdec04579160ae17225d66034bd723
          path: .cache/local-whisper/ci-source-repositories/googletest
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout locked nlohmann/json source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nlohmann/json
          ref: 55f93686c01528224f448c19128836e7df245f72
          path: .cache/local-whisper/ci-source-repositories/nlohmann-json
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout locked Whisper.cpp source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ggml-org/whisper.cpp
          ref: f049fff95a089aa9969deb009cdd4892b3e74916
          path: .cache/local-whisper/ci-source-repositories/whisper-cpp
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm run ci:install

      - name: Materialize and verify locked GoogleTest source
        shell: pwsh
        run: |
          node scripts/local-whisper/source-import/materialize-native-source.mjs --lock-file=runtime/local-whisper/sources/locks/googletest-v1.17.0-52eb810.json --repository-root=.cache/local-whisper/ci-source-repositories/googletest --store-root=.cache/local-whisper/native-sources
          npm run verify:local-whisper:native-source -- --lock=googletest-v1.17.0-52eb810

      - name: Materialize and verify locked Whisper.cpp worker-core sources
        shell: pwsh
        run: |
          node scripts/local-whisper/source-import/materialize-native-source.mjs --lock-file=runtime/local-whisper/sources/locks/nlohmann-json-v3.12.0-subset.json --repository-root=.cache/local-whisper/ci-source-repositories/nlohmann-json --store-root=.cache/local-whisper/native-sources
          node scripts/local-whisper/source-import/materialize-native-source.mjs --lock-file=runtime/local-whisper/sources/locks/whisper-cpp-v1.9.1-f049fff.json --repository-root=.cache/local-whisper/ci-source-repositories/whisper-cpp --store-root=.cache/local-whisper/native-sources
          npm run verify:local-whisper:native-source -- --lock=nlohmann-json-v3.12.0-subset
          npm run verify:local-whisper:native-source -- --lock=whisper-cpp-v1.9.1-f049fff

      - name: Initialize MSVC developer environment
        uses: ./.github/actions/initialize-msvc-environment
        with:
          required-compiler-version: '19.39'

      - name: Run MSVC native unit and integration tests
        run: npm run test:local-whisper:fs-guard:native

      - name: Run MSVC launcher unit and Job Object integration tests
        run: npm run test:local-whisper:launcher:native

      - name: Run MSVC common SHA-256 and frame codec tests
        run: npm run test:local-whisper:worker-codec

      - name: Run MSVC Whisper.cpp worker-core suite
        run: npm run test:local-whisper:whisper-cpp-core

      - name: Run MSVC AddressSanitizer native suites
        run: |
          npm run test:local-whisper:fs-guard:msvc-asan
          npm run test:local-whisper:launcher:msvc-asan
          npm run test:local-whisper:worker-codec:msvc-asan
          npm run test:local-whisper:whisper-cpp:msvc-asan

      - name: Run Local Whisper supervisor conformance tests
        run: npm run test:local-whisper:supervisor

      - name: Verify Windows model-authority source contract
        run: npm run verify:local-whisper:worker-authority -- --platform=windows --contract-only

      - name: Verify Windows Whisper.cpp CPU source contract
        run: npm run verify:local-whisper:whisper-cpp-cpu -- --profile=windows-x64-cpu-msvc-19.39-v1 --contract-only

      - name: Build and verify hardened Windows production binaries
        run: |
          npm run build:local-whisper:fs-guard
          npm run build:local-whisper:launcher
          npm run build:local-whisper:whisper-cpp-cpu -- --profile=windows-x64-cpu-msvc-19.39-v1
          npm run verify:local-whisper:native-hardening -- --platform=windows

      - name: Verify Windows Whisper.cpp CUDA source contract
        run: npm run verify:local-whisper:whisper-cpp-cuda -- --profile=windows-x64-cuda-12.8.1-sm120a-msvc-19.39-v1 --contract-only

      # This executes static, hardware-free contract checks only. Physical AMD
      # qualification remains out of scope and must not acquire a driver or SDK.
      - name: Run Windows AMD Vulkan static contract
        run: npm run verify:local-whisper:amd-packs -- --profile=vulkan-windows-x64

      - name: Run Windows Node/native filesystem compatibility tests
        run: npm run test:local-whisper:filesystem

      - name: Emit primary Windows runner evidence
        shell: pwsh
        run: npm run emit:local-whisper:runner-evidence -- --runner-label=windows-2025 --toolchain=msvc-19.39 --compiler="$env:CXX" --output=release-artifacts/local-whisper-runner-evidence-windows-primary.json --tested-digests=52eb8108c5bdec04579160ae17225d66034bd723,55f93686c01528224f448c19128836e7df245f72,f049fff95a089aa9969deb009cdd4892b3e74916

      - name: Upload primary Windows runner evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-whisper-runner-evidence-windows-primary
          path: release-artifacts/local-whisper-runner-evidence-windows-primary.json
          if-no-files-found: error
          retention-days: 14

  native-quality-linux-compatibility:
    name: Local Whisper Native Compatibility (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CMAKE_COMMAND: /usr/bin/cmake
      CTEST_COMMAND: /usr/bin/ctest
      CXX: clang++-18
      LOCAL_WHISPER_PREPARED_LINUX_COMPATIBILITY: 'true'
      NINJA_COMMAND: /usr/bin/ninja
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Provision pinned ordinary native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates cmake curl gpg ninja-build
          curl --fail --show-error --silent --location https://apt.llvm.org/llvm-snapshot.gpg.key --output /tmp/llvm-snapshot.asc
          echo '8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d  /tmp/llvm-snapshot.asc' | sha256sum --check --status
          gpg --dearmor --yes --output /tmp/llvm-snapshot.gpg /tmp/llvm-snapshot.asc
          sudo install --mode=0644 /tmp/llvm-snapshot.gpg /usr/share/keyrings/llvm-snapshot.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main' | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-18.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes clang-18
          clang++-18 --version

      - name: Install dependencies
        run: npm run ci:install

      - name: Provision and verify locked native sources
        run: |
          npm run prepare:local-whisper:native-test-sources
          npm run verify:local-whisper:native-source -- --lock=nlohmann-json-v3.12.0-subset
          npm run verify:local-whisper:native-source -- --lock=googletest-v1.17.0-52eb810
          npm run verify:local-whisper:native-source -- --lock=whisper-cpp-v1.9.1-f049fff

      - name: Run ordinary Linux native unit and integration manifests
        run: |
          npm run test:local-whisper:fs-guard:native
          npm run test:local-whisper:launcher:native
          npm run test:local-whisper:worker-codec
          npm run test:local-whisper:whisper-cpp-core
          npm run test:local-whisper:filesystem

      - name: Build ordinary Linux production native manifests
        run: |
          npm run build:local-whisper:fs-guard
          npm run build:local-whisper:launcher
          npm run build:local-whisper:whisper-cpp-cpu -- --profile=linux-x64-cpu-baseline-v1
          npm run verify:local-whisper:whisper-cpp-cpu -- --profile=linux-x64-cpu-baseline-v1

      - name: Emit compatibility Linux runner evidence
        run: npm run emit:local-whisper:runner-evidence -- --runner-label=ubuntu-22.04 --toolchain=clang-18 --compiler="$CXX" --output=release-artifacts/local-whisper-runner-evidence-linux-compatibility.json --tested-digests=52eb8108c5bdec04579160ae17225d66034bd723,55f93686c01528224f448c19128836e7df245f72,f049fff95a089aa9969deb009cdd4892b3e74916

      - name: Upload compatibility Linux runner evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-whisper-runner-evidence-linux-compatibility
          path: release-artifacts/local-whisper-runner-evidence-linux-compatibility.json
          if-no-files-found: error
          retention-days: 14

  native-quality-windows-compatibility:
    name: Local Whisper Native Compatibility (Windows Server 2022)
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      LOCAL_WHISPER_PREPARED_WINDOWS_COMPATIBILITY: 'true'
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout locked GoogleTest source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          path: .cache/local-whisper/ci-source-repositories/googletest
          persist-credentials: false
          ref: 52eb8108c5bdec04579160ae17225d66034bd723
          repository: google/googletest

      - name: Checkout locked nlohmann/json source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          path: .cache/local-whisper/ci-source-repositories/nlohmann-json
          persist-credentials: false
          ref: 55f93686c01528224f448c19128836e7df245f72
          repository: nlohmann/json

      - name: Checkout locked Whisper.cpp source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          path: .cache/local-whisper/ci-source-repositories/whisper-cpp
          persist-credentials: false
          ref: f049fff95a089aa9969deb009cdd4892b3e74916
          repository: ggml-org/whisper.cpp

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm run ci:install

      - name: Materialize and verify locked native sources
        shell: pwsh
        run: |
          node scripts/local-whisper/source-import/materialize-native-source.mjs --lock-file=runtime/local-whisper/sources/locks/googletest-v1.17.0-52eb810.json --repository-root=.cache/local-whisper/ci-source-repositories/googletest --store-root=.cache/local-whisper/native-sources
          node scripts/local-whisper/source-import/materialize-native-source.mjs --lock-file=runtime/local-whisper/sources/locks/nlohmann-json-v3.12.0-subset.json --repository-root=.cache/local-whisper/ci-source-repositories/nlohmann-json --store-root=.cache/local-whisper/native-sources
          node scripts/local-whisper/source-import/materialize-native-source.mjs --lock-file=runtime/local-whisper/sources/locks/whisper-cpp-v1.9.1-f049fff.json --repository-root=.cache/local-whisper/ci-source-repositories/whisper-cpp --store-root=.cache/local-whisper/native-sources
          npm run verify:local-whisper:native-source -- --lock=googletest-v1.17.0-52eb810
          npm run verify:local-whisper:native-source -- --lock=nlohmann-json-v3.12.0-subset
          npm run verify:local-whisper:native-source -- --lock=whisper-cpp-v1.9.1-f049fff

      - name: Initialize pinned MSVC developer environment
        uses: ./.github/actions/initialize-msvc-environment
        with:
          required-compiler-version: '19.39'

      - name: Run ordinary Windows native unit and integration manifests
        run: |
          npm run test:local-whisper:fs-guard:native
          npm run test:local-whisper:launcher:native
          npm run test:local-whisper:worker-codec
          npm run test:local-whisper:whisper-cpp-core
          npm run test:local-whisper:filesystem

      - name: Build ordinary Windows production native manifests
        run: |
          npm run build:local-whisper:fs-guard
          npm run build:local-whisper:launcher
          npm run build:local-whisper:whisper-cpp-cpu -- --profile=windows-x64-cpu-msvc-19.39-v1
          npm run verify:local-whisper:whisper-cpp-cpu -- --profile=windows-x64-cpu-msvc-19.39-v1

      - name: Emit compatibility Windows runner evidence
        shell: pwsh
        run: npm run emit:local-whisper:runner-evidence -- --runner-label=windows-2022 --toolchain=msvc-19.39 --compiler="$env:CXX" --output=release-artifacts/local-whisper-runner-evidence-windows-compatibility.json --tested-digests=52eb8108c5bdec04579160ae17225d66034bd723,55f93686c01528224f448c19128836e7df245f72,f049fff95a089aa9969deb009cdd4892b3e74916

      - name: Upload compatibility Windows runner evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-whisper-runner-evidence-windows-compatibility
          path: release-artifacts/local-whisper-runner-evidence-windows-compatibility.json
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Quality Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Cache Electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.NPM_CONFIG_CACHE }}
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm run ci:install

      - name: Check formatting
        run: npm run format:check

      - name: Validate Dependabot configuration
        run: npm run validate:dependabot

      - name: Generate package metadata
        run: npm run generate:package-metadata -- --release-date=2026-05-18

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run test:types

      - name: Unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Build production bundles
        run: npm run build:prod

  package-smoke-fedora:
    name: Package Smoke (Fedora Linux)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FEDORA_RELEASE_IMAGE: gpt-voice-fedora-release:ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Cache Fedora release workspace
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/npm
            .cache/electron
            .cache/electron-builder
            .cache/fedora-home
          key: ${{ runner.os }}-fedora-smoke-workspace-${{ hashFiles('package-lock.json', 'package.json', 'scripts/prepare-cloakbrowser.mjs', 'build/fedora-release/**') }}
          restore-keys: |
            ${{ runner.os }}-fedora-smoke-workspace-

      - name: Build Fedora release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: build/fedora-release
          file: build/fedora-release/Dockerfile
          load: true
          tags: ${{ env.FEDORA_RELEASE_IMAGE }}
          cache-from: type=gha,scope=fedora-release-image
          cache-to: type=gha,mode=max,scope=fedora-release-image

      - name: Smoke package app in Fedora
        run: node scripts/build-fedora-release.mjs --skip-image-build --image=${{ env.FEDORA_RELEASE_IMAGE }} --mode=smoke --release-date=2026-05-18

      - name: Upload Linux measurement reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpt-voice-linux-measurements
          path: |
            release-artifacts/size-linux-x64.json
            release-artifacts/startup-linux-x64.json
          if-no-files-found: error
          retention-days: 14

  package-smoke-windows:
    name: Package Smoke (Windows)
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Cache Electron and CloakBrowser binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.NPM_CONFIG_CACHE }}
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ~/.cloakbrowser
          key: ${{ runner.os }}-electron-cloak-${{ hashFiles('package-lock.json', 'package.json', 'scripts/prepare-cloakbrowser.mjs') }}
          restore-keys: |
            ${{ runner.os }}-electron-cloak-

      - name: Install dependencies
        run: npm run ci:install

      - name: Initialize MSVC developer environment
        uses: ./.github/actions/initialize-msvc-environment
        with:
          required-compiler-version: '19.39'

      - name: Prepare bundled CloakBrowser
        run: npm run prepare:cloakbrowser -- --target=win32

      - name: Smoke test CloakBrowser
        run: npm run smoke:cloakbrowser

      - name: Build production bundles
        run: npm run build:prod

      - name: Generate package metadata
        run: npm run generate:package-metadata -- --release-date=2026-05-18

      - name: Prepare disabled Local Whisper package resources
        run: npm run prepare:local-whisper:packaging -- --mode=disabled --platform=win32

      - name: Package unpacked app
        run: npx electron-builder --win dir

      - name: Verify packaged runtime
        run: npm run verify:packaged

      - name: Measure Windows package size
        run: npm run measure:size -- --platform=win32 --arch=x64 --output=release-artifacts/size-win32-x64.json

      - name: Verify Windows size budget when a reviewed baseline exists
        if: hashFiles('build/size-baselines/v1.4.0-win32-x64.json') != ''
        run: npm run verify:size -- --report=release-artifacts/size-win32-x64.json --baseline=build/size-baselines/v1.4.0-win32-x64.json

      - name: Measure Windows cold startup
        run: npm run measure:startup -- --runs=10 --output=release-artifacts/startup-win32-x64.json

      - name: Upload Windows measurement reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpt-voice-windows-measurements
          path: |
            release-artifacts/size-win32-x64.json
            release-artifacts/startup-win32-x64.json
          if-no-files-found: error
          retention-days: 14
