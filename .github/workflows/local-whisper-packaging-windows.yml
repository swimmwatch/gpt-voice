name: Local Whisper Windows Fixture Consumer

on:
  workflow_call:
    inputs:
      bundle_digest:
        description: Exact canonical fixture bundle-manifest SHA-256 from the producer.
        required: true
        type: string
      windows_qualification_authorized:
        description: Must be true only during the representative Task 21 Windows qualification.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  windows-consumer-package:
    name: Deferred Windows qualification fixture consumer/package
    if: ${{ inputs.windows_qualification_authorized }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CI: true
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm run ci:install

      - name: Download already-produced public fixture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: local-whisper-public-fixture-v1
          path: .cache/local-whisper/public-fixture

      - name: Build application bundles
        run: npm run build:prod

      - name: Prepare bundled CloakBrowser
        run: npm run prepare:cloakbrowser -- --target=win32

      - name: Generate package metadata
        run: npm run generate:package-metadata -- --release-date=2026-05-18

      - name: Verify declared digest and stage Windows fixture resources
        env:
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        run: npm run prepare:local-whisper:packaging -- --mode=fixture --platform=win32 --bundle=.cache/local-whisper/public-fixture --bundle-digest=$env:BUNDLE_DIGEST

      - name: Inspect Windows base-package policy
        run: node --import tsx scripts/local-whisper/packaging/verify-package-policy.ts --directory=build/generated/local-whisper --mode=fixture --platform=win32

      - name: Package unpacked Windows app
        run: npx electron-builder --win dir

      - name: Verify packaged runtime
        run: npm run verify:packaged
