name: Dependency Review

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review (npm)
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 10

    steps:
      - name: Review supported npm dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
