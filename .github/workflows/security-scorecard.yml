name: Advisory OpenSSF Scorecard

on:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scorecard:
    name: Advisory OpenSSF Scorecard
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run advisory OpenSSF Scorecard
        id: scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@ff5dd8929f96a8a4dc67d13f32b8c75057829621 # v2.4.0
        with:
          publish_results: false
          results_file: scorecard-results.sarif
          results_format: sarif

      - name: Publish bounded advisory SARIF
        if: ${{ always() && hashFiles('scorecard-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /security:openssf-scorecard-advisory
          sarif_file: scorecard-results.sarif

      - name: Record advisory outcome
        if: always()
        run: >-
          echo "OpenSSF Scorecard advisory outcome: ${{ steps.scorecard.outcome }}"
          >> "$GITHUB_STEP_SUMMARY"
